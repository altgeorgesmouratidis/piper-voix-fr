scenes:
  # ================================================================ TITRE
  - id: s00_titre
    layout: title
    notion: 'Introduction'
    beats:
      - "Analyse de données, chapitre 5, deuxième partie."
      - "On voit ce qui change quand on sait déjà quelque chose : les probabilités conditionnelles, les probabilités totales, et le théorème de Bayes."
    html: |
      <svg viewBox="0 0 560 560" width="560" height="560">
        <circle cx="280" cy="280" r="250" fill="var(--paper)" stroke="var(--line)" stroke-width="3"/>
        <g data-beat="1" data-anim="draw" data-dur="1.2">
          <line class="stroke" x1="130" y1="280" x2="280" y2="170"/>
          <line class="stroke" x1="130" y1="280" x2="280" y2="390"/>
          <line class="stroke muted" x1="280" y1="170" x2="420" y2="120"/>
          <line class="stroke muted" x1="280" y1="170" x2="420" y2="220"/>
          <line class="stroke muted" x1="280" y1="390" x2="420" y2="340"/>
          <line class="stroke accent" x1="280" y1="390" x2="420" y2="440"/>
        </g>
        <g data-beat="1+1.0" data-anim="pop">
          <circle cx="130" cy="280" r="16" fill="var(--main)"/>
          <circle cx="280" cy="170" r="14" fill="var(--main)"/>
          <circle cx="280" cy="390" r="14" fill="var(--main)"/>
          <circle cx="420" cy="440" r="14" fill="var(--accent)"/>
        </g>
      </svg>

  # ================================================================ NOTION 1 : CONDITIONNELLE
  - id: s01_cond_intuition
    notion: 'Probabilités conditionnelles'
    tag: 'Notion 1 / 7'
    title: 'Quand on sait déjà quelque chose'
    subtitle: 'Probabilité conditionnelle'
    hold: 0.5
    beats:
      - "En général, les événements d'une même expérience s'influencent. On dit qu'ils sont dépendants."
      - "Imagine : tu jettes un dé sous un gobelet. Un ami jette un œil et te dit seulement : c'est pair."
      - "Prenons A : le point est 6, et B : le point est pair. Sans information, P de A vaut 1 sur 6."
      - "Mais si on sait que B est réalisé, il ne reste que trois résultats possibles : 2, 4 et 6."
      - "Le 6 est un cas sur trois. La probabilité de A sachant B vaut donc 1 sur 3."
      - "On la note P de A barre oblique B, et on lit : probabilité de A sachant B."
    html: |
      <div class="col w40">
        <div class="analogy" data-beat="1">
          <div class="icon">🥤</div>
          <div><b>Le dé sous le gobelet</b><br><span class="muted">« c'est pair ! »</span></div>
        </div>
        <div class="def" data-beat="0"><div class="term">Dépendants</div>l'un influence l'autre</div>
      </div>
      <div class="col grow">
        <div class="calc" data-beat="2">$A$ = « 6 » · $B$ = « pair » · $P(A) = \tfrac16$</div>
        <div class="row" data-beat="3">
          <span class="chip" data-dim="3">1</span><span class="chip fill">2</span><span class="chip" data-dim="3">3</span><span class="chip fill">4</span><span class="chip" data-dim="3">5</span><span class="chip fill ring" data-hl="4">6</span>
        </div>
        <div class="card main" data-beat="4">
          <div class="formula">$$P(A / B) = \frac13$$</div>
        </div>
        <div class="keep" data-beat="5">$P(A/B)$ : « probabilité de $A$ <b>sachant</b> $B$ »</div>
      </div>

  - id: s02_cond_formule
    notion: 'Probabilités conditionnelles'
    tag: 'Notion 1 / 7'
    title: 'La formule de P(A / B)'
    subtitle: 'On se restreint aux cas où B est réalisé'
    hold: 0.6
    beats:
      - "Voici la formule : P de A sachant B égale P de A inter B, divisé par P de B."
      - "L'idée : on ne garde comme cas possibles que ceux où B est réalisé. Et au numérateur, ceux où A est aussi réalisé."
      - "Autrement dit : les cas favorables à A et B, divisés par les cas favorables à B."
      - "Vérifions avec le dé. A inter B, c'est 6 et pair : seulement le 6, donc 1 sur 6. Et P de B vaut 1 sur 2."
      - "1 sur 6, divisé par 1 sur 2, ça fait bien 1 sur 3. On retrouve le résultat."
    html: |
      <div class="col w50">
        <div class="card" data-beat="0">
          <div class="formula">$$P(A / B) = \frac{\htmlData{hl=2}{P(A \cap B)}}{\htmlData{hl=1}{P(B)}}$$</div>
        </div>
        <div class="card" data-beat="2">
          <div class="formula sm">$$\frac{\text{cas favorables à } A \text{ ET } B}{\text{cas favorables à } B}$$</div>
        </div>
      </div>
      <div class="col w50">
        <div class="calc" data-beat="3">$P(A \cap B) = P(\{6\}) = \tfrac16$</div>
        <div class="calc" data-beat="3+3">$P(B) = \tfrac36 = \tfrac12$</div>
        <div class="card main" data-beat="4">
          <div class="formula sm">$$P(A/B) = \frac{1/6}{1/2} = \frac13$$</div>
        </div>
      </div>

  # ================================================================ NOTION 2 : MULTIPLICATION
  - id: s03_multiplication
    notion: 'Théorème de multiplication'
    tag: 'Notion 2 / 7'
    title: 'Le théorème de multiplication'
    subtitle: 'La probabilité du ET'
    hold: 0.6
    beats:
      - "Si on retourne la formule précédente, on obtient la probabilité de A inter B, c'est-à-dire A et B."
      - "P de A inter B égale P de A, fois P de B sachant A."
      - "Comme tu l'as noté, on peut aussi partir de B : P de B, fois P de A sachant B. Les deux écritures sont justes."
      - "Exemple avec le dé : P de, pair et 6, égale P de pair, fois P de 6 sachant pair."
      - "Ça fait 1 sur 2, fois 1 sur 3, donc 1 sur 6. C'est logique : pair et 6, c'est simplement le 6."
    html: |
      <div class="col w60">
        <div class="card" data-beat="1">
          <div class="formula">$$P(A \cap B) = P(A) \cdot P(B / A)$$</div>
        </div>
        <div class="card gold" data-beat="2">
          <div class="formula sm">$$P(A \cap B) = P(B) \cdot P(A / B)$$</div>
        </div>
      </div>
      <div class="col grow">
        <div class="calc" data-beat="0">ET = intersection $\cap$</div>
        <div class="calc" data-beat="3">$P(\text{pair} \cap 6)$</div>
        <div class="calc" data-beat="3+1.5">$= P(\text{pair}) \cdot P(6 / \text{pair})$</div>
        <div class="calc" data-beat="4">$= \tfrac12 \times \tfrac13 = $ <span class="res">$\tfrac16$</span></div>
      </div>

  # ================================================================ NOTION 3 : INDÉPENDANCE
  - id: s04_independance
    notion: 'Événements indépendants'
    tag: 'Notion 3 / 7'
    title: 'Événements indépendants'
    subtitle: 'Savoir B ne change rien pour A'
    hold: 0.5
    beats:
      - "Deux événements sont indépendants quand la réalisation de l'un n'influence pas la probabilité de l'autre."
      - "En formule : P de A sachant B égale P de A. Savoir que B est réalisé ne change rien."
      - "Dans ce cas, le théorème de multiplication se simplifie : P de A inter B égale P de A fois P de B."
      - "Exemple : on lance une pièce et un dé. Les deux n'ont aucun lien."
      - "P de, pile et 6, égale 1 sur 2 fois 1 sur 6, soit 1 sur 12."
    html: |
      <div class="col w50">
        <div class="def" data-beat="0"><div class="term">Indépendants</div>l'un n'influence pas l'autre</div>
        <div class="calc" data-beat="1">$P(A / B) = P(A)$</div>
        <div class="card main" data-beat="2">
          <div class="formula">$$P(A \cap B) = P(A) \cdot P(B)$$</div>
        </div>
      </div>
      <div class="col w50">
        <div class="analogy" data-beat="3">
          <div class="icon">🪙🎲</div>
          <div><b>Une pièce et un dé</b><br><span class="muted">aucun lien entre eux</span></div>
        </div>
        <div class="calc" data-beat="4">$P(\text{pile} \cap 6) = \tfrac12 \times \tfrac16 = $ <span class="res">$\tfrac1{12}$</span></div>
      </div>

  - id: s05_urne_sans
    notion: 'Événements indépendants'
    tag: 'Notion 3 / 7'
    title: 'L''urne : tirage sans remise'
    subtitle: '5 boules blanches, 5 boules noires'
    hold: 0.6
    beats:
      - "Exemple du cours : une urne contient 5 boules blanches et 5 boules noires. On tire deux boules. Quelle est la probabilité de tirer deux blanches ?"
      - "On applique le théorème de multiplication : P de, première blanche, fois P de, deuxième blanche sachant que la première était blanche."
      - "Au premier tirage, 5 blanches sur 10 boules : 5 sur 10."
      - "On ne remet pas la boule. Il reste 9 boules, dont 4 blanches. Le deuxième tirage dépend donc du premier : 4 sur 9."
      - "Résultat : 5 sur 10 fois 4 sur 9, ça fait 2 sur 9, environ 0,222."
    html: |
      <svg class="w40" viewBox="0 0 600 460" width="600" height="460" data-beat="0" data-anim="fade">
        <path class="stroke muted" d="M90 60 V380 Q90 430 140 430 H460 Q510 430 510 380 V60"/>
        <g stroke="var(--ink)" stroke-width="3">
          <circle cx="160" cy="370" r="34" fill="var(--paper)"/>
          <circle cx="240" cy="370" r="34" fill="var(--paper)"/>
          <circle cx="320" cy="370" r="34" fill="var(--ink)"/>
          <circle cx="400" cy="370" r="34" fill="var(--paper)"/>
          <circle cx="200" cy="300" r="34" fill="var(--ink)"/>
          <circle cx="280" cy="300" r="34" fill="var(--paper)"/>
          <circle cx="360" cy="300" r="34" fill="var(--ink)"/>
          <circle cx="440" cy="300" r="34" fill="var(--ink)"/>
          <circle cx="160" cy="230" r="34" fill="var(--ink)"/>
          <circle cx="400" cy="230" r="34" fill="var(--paper)" data-out="3"/>
        </g>
        <circle cx="540" cy="110" r="34" fill="var(--paper)" stroke="var(--accent)" stroke-width="5" data-beat="3" data-anim="pop"/>
        <text x="540" y="60" font-size="30" text-anchor="middle" fill="var(--accent)" data-beat="3">tirée</text>
      </svg>
      <div class="col grow">
        <div class="calc" data-beat="1">$P(B_1 \cap B_2) = P(B_1) \cdot P(B_2 / B_1)$</div>
        <div class="row">
          <div class="card" data-beat="2"><div class="label">1er tirage</div><div class="formula sm">$$\frac{5}{10}$$</div></div>
          <div class="card" data-beat="3"><div class="label">2e tirage</div><div class="formula sm">$$\frac{4}{9}$$</div></div>
        </div>
        <div class="card main" data-beat="4">
          <div class="formula sm">$$\frac{5}{10} \times \frac49 = \frac29 \approx 0{,}222$$</div>
        </div>
      </div>

  - id: s06_urne_avec
    notion: 'Événements indépendants'
    tag: 'Notion 3 / 7'
    title: 'L''urne : tirage avec remise'
    subtitle: 'Même urne, autre règle'
    hold: 0.6
    beats:
      - "Même expérience, mais avec remise : on remet la première boule dans l'urne avant le deuxième tirage."
      - "Cette fois, l'urne est identique au deuxième tirage. Les deux tirages sont indépendants."
      - "On multiplie simplement : 5 sur 10, fois 5 sur 10, ça fait 1 sur 4, soit 0,25."
      - "Compare : sans remise, 0,222. Avec remise, 0,25. Retirer une blanche diminue un peu les chances d'en retirer une."
      - "À retenir : sans remise, les tirages sont dépendants. Avec remise, ils sont indépendants."
    html: |
      <div class="col w50">
        <div class="def" data-beat="0"><div class="term">Avec remise</div>on remet la boule dans l'urne</div>
        <div class="calc" data-beat="1">2e tirage = même urne → <b>indépendants</b></div>
        <div class="card main" data-beat="2">
          <div class="formula sm">$$\frac{5}{10} \times \frac{5}{10} = \frac14 = 0{,}25$$</div>
        </div>
      </div>
      <div class="col w50">
        <table class="data" data-beat="3">
          <tr><th>tirage</th><th>P(2 blanches)</th></tr>
          <tr><td>sans remise</td><td>$\tfrac29 \approx 0{,}222$</td></tr>
          <tr><td>avec remise</td><td>$\tfrac14 = 0{,}25$</td></tr>
        </table>
        <div class="keep" data-beat="4">sans remise : <b>dépendants</b> · avec remise : <b>indépendants</b></div>
      </div>

  - id: s07_generalisation
    notion: 'Événements indépendants'
    tag: 'Notion 3 / 7'
    title: 'Avec trois événements'
    subtitle: 'Le théorème de multiplication généralisé'
    hold: 0.6
    beats:
      - "Le théorème se généralise à trois événements. P de A inter B inter C égale P de A, fois P de B sachant A, fois P de C sachant A inter B."
      - "Chaque facteur tient compte de tout ce qui s'est passé avant."
      - "Si les trois événements sont indépendants, on multiplie simplement les trois probabilités."
      - "Exemple avec notre urne : trois blanches de suite, sans remise. 5 sur 10, puis 4 sur 9, puis 3 sur 8. Ça fait 1 sur 12."
      - "Avec remise, les tirages sont indépendants : un demi, trois fois, soit 1 sur 8."
    html: |
      <div class="col w100">
        <div class="card" data-beat="0">
          <div class="formula sm">$$P(A \cap B \cap C) = P(A) \cdot P(B / A) \cdot \htmlData{hl=1}{P(C / (A \cap B))}$$</div>
        </div>
        <div class="calc" data-beat="2">indépendants : $P(A \cap B \cap C) = P(A) \cdot P(B) \cdot P(C)$</div>
        <div class="row">
          <div class="card main" data-beat="3"><div class="label">Sans remise</div><div class="formula sm">$$\frac{5}{10} \times \frac49 \times \frac38 = \frac1{12}$$</div></div>
          <div class="card" data-beat="4"><div class="label">Avec remise</div><div class="formula sm">$$\left(\frac12\right)^3 = \frac18$$</div></div>
        </div>
      </div>

  # ================================================================ NOTION 4 : PROBABILITÉS TOTALES (BUS)
  - id: s08_bus
    notion: 'Probabilités totales'
    tag: 'Notion 4 / 7'
    title: 'Le bus arrive-t-il à l''heure ?'
    subtitle: 'Une probabilité qui dépend du jour'
    hold: 0.6
    beats:
      - "Passons aux probabilités totales, avec l'exemple du bus. Sa ponctualité dépend du jour."
      - "Le week-end, le trafic est calme : il est à l'heure avec une probabilité de 0,9. Le lundi et le vendredi, il y a beaucoup de trafic : 0,6. Les autres jours, 0,8."
      - "Question : quelle est la probabilité que le bus soit à l'heure, un jour quelconque ?"
      - "On découpe selon les jours : week-end, lundi ou vendredi, et mardi, mercredi ou jeudi. Ces cas sont incompatibles, donc on additionne."
      - "Chaque terme est un ET : on utilise la multiplication. Par exemple, 2 jours sur 7 fois 0,9 pour le week-end."
      - "Au total : 2 sur 7 fois 0,9, plus 2 sur 7 fois 0,6, plus 3 sur 7 fois 0,8. On obtient environ 0,771 : 77 % de chances."
    html: |
      <div class="col" style="width:720px">
        <table class="data" data-beat="1">
          <tr><th>jours</th><th>P(jours)</th><th style="white-space:nowrap">à l'heure</th></tr>
          <tr><td style="white-space:nowrap">week-end</td><td>$\tfrac27$</td><td>0,9</td></tr>
          <tr><td>lu, ve</td><td>$\tfrac27$</td><td>0,6</td></tr>
          <tr><td style="white-space:nowrap">ma, me, je</td><td>$\tfrac37$</td><td>0,8</td></tr>
        </table>
        <div class="card" data-beat="3"><div class="label">Correction du cours p. 50</div>« <b>mardi</b>, mercredi ou jeudi »</div>
      </div>
      <div class="col grow">
        <div class="calc" data-beat="2">$P(\text{à l'heure})$ ?</div>
        <div class="calc" data-beat="3">3 cas incompatibles → on <b>additionne</b></div>
        <div class="calc" data-beat="4">$P(\text{we}) \cdot P(\text{heure}/\text{we}) = \tfrac27 \times 0{,}9$</div>
        <div class="card main" data-beat="5">
          <div class="formula sm">$$\tfrac27 \cdot 0{,}9 + \tfrac27 \cdot 0{,}6 + \tfrac37 \cdot 0{,}8 \approx \htmlData{hl=5+3}{0{,}771}$$</div>
        </div>
      </div>

  - id: s09_arbre
    notion: 'Arbre de probabilités'
    tag: 'Notion 4 / 7'
    title: 'L''arbre de probabilités'
    subtitle: 'Multiplier le long d''un chemin, additionner les chemins'
    hold: 0.6
    beats:
      - "Cette situation se dessine très bien en arbre. Au premier niveau, les jours, avec leurs probabilités."
      - "Au deuxième niveau, à l'heure ou en retard, avec les probabilités conditionnelles. Par exemple, sachant week-end, 0,9 et 0,1."
      - "Règle 1 : les branches qui partent d'un même sommet sont incompatibles, et couvrent tous les cas. Leur somme vaut donc 1."
      - "Règle 2 : la probabilité d'un chemin, c'est le produit des probabilités de ses branches."
      - "Règle 3 : pour un événement, on additionne tous les chemins qui y mènent. Les trois chemins à l'heure donnent 0,771."
      - "Remarque : c'est une moyenne pondérée des probabilités, par la fréquence des jours."
    html: |
      <svg class="tree" viewBox="0 0 1000 560" width="1000" height="560">
        <g data-beat="0" data-anim="draw">
          <line class="stroke" x1="60" y1="280" x2="360" y2="100"/>
          <line class="stroke" x1="60" y1="280" x2="360" y2="280"/>
          <line class="stroke" x1="60" y1="280" x2="360" y2="460"/>
        </g>
        <g data-beat="1" data-anim="draw">
          <line class="stroke muted" x1="360" y1="100" x2="640" y2="45"/>
          <line class="stroke muted" x1="360" y1="100" x2="640" y2="150"/>
          <line class="stroke muted" x1="360" y1="280" x2="640" y2="225"/>
          <line class="stroke muted" x1="360" y1="280" x2="640" y2="330"/>
          <line class="stroke muted" x1="360" y1="460" x2="640" y2="405"/>
          <line class="stroke muted" x1="360" y1="460" x2="640" y2="510"/>
        </g>
        <g data-beat="4" data-anim="fade">
          <line class="stroke accent" x1="60" y1="280" x2="360" y2="100" stroke-width="7"/><line class="stroke accent" x1="360" y1="100" x2="640" y2="45" stroke-width="7"/>
          <line class="stroke accent" x1="60" y1="280" x2="360" y2="280" stroke-width="7"/><line class="stroke accent" x1="360" y1="280" x2="640" y2="225" stroke-width="7"/>
          <line class="stroke accent" x1="60" y1="280" x2="360" y2="460" stroke-width="7"/><line class="stroke accent" x1="360" y1="460" x2="640" y2="405" stroke-width="7"/>
        </g>
        <circle cx="60" cy="280" r="10" fill="var(--ink)"/>
        <g data-beat="0">
          <text x="310" y="78" text-anchor="end">week-end</text><text class="p" x="170" y="185">2/7</text>
          <text x="345" y="262" text-anchor="end">lu/ve</text><text class="p" x="150" y="268">2/7</text>
          <text x="310" y="510" text-anchor="end">ma/me/je</text><text class="p" x="170" y="410">3/7</text>
        </g>
        <g data-beat="1">
          <text class="p" x="500" y="58">0,9</text><text x="660" y="57">à l'heure</text>
          <text class="p" x="500" y="160">0,1</text><text x="660" y="162">en retard</text>
          <text class="p" x="500" y="238">0,6</text><text x="660" y="237">à l'heure</text>
          <text class="p" x="500" y="340">0,4</text><text x="660" y="342">en retard</text>
          <text class="p" x="500" y="418">0,8</text><text x="660" y="417">à l'heure</text>
          <text class="p" x="500" y="520">0,2</text><text x="660" y="522">en retard</text>
        </g>
      </svg>
      <div class="col grow">
        <div class="calc" data-beat="2">① branches d'un sommet : somme = 1</div>
        <div class="calc" data-beat="3">② chemin : on <b>multiplie</b></div>
        <div class="calc" data-beat="4">③ événement : on <b>additionne</b> les chemins</div>
        <div class="keep" data-beat="5">= moyenne <b>pondérée</b> : 0,771</div>
      </div>

  # ================================================================ NOTION 5 : SYSTÈME EXHAUSTIF
  - id: s10_exhaustif
    notion: 'Système exhaustif'
    tag: 'Notion 5 / 7'
    title: 'Système exhaustif d''événements'
    subtitle: 'Découper Ω sans trou ni chevauchement'
    hold: 0.6
    beats:
      - "Pour énoncer la formule générale, il faut un système exhaustif d'événements : on découpe oméga en morceaux disjoints."
      - "Un ensemble d'événements E 1 à E n est un système exhaustif si trois conditions sont vraies."
      - "Un : aucun événement n'est impossible. Chaque P de E i est strictement positif."
      - "Deux : ils sont incompatibles deux à deux. Aucun chevauchement."
      - "Trois : leur union recouvre tout oméga. Aucun trou."
      - "Comme les pièces d'un puzzle : elles ne se chevauchent pas, et ensemble elles forment l'image complète."
    html: |
      <svg class="w40" viewBox="0 0 600 440" width="600" height="440" data-beat="0" data-anim="fade">
        <rect x="10" y="10" width="580" height="420" rx="30" fill="var(--paper)"/>
        <path d="M10 40 Q10 10 40 10 H230 L190 430 H40 Q10 430 10 400 Z" fill="var(--main)" opacity="0.30" data-beat="5" data-anim="fade"/>
        <path d="M230 10 H420 L360 230 L190 430 Z" fill="var(--gold)" opacity="0.40" data-beat="5" data-anim="fade"/>
        <path d="M420 10 H560 Q590 10 590 40 V400 Q590 430 560 430 H190 L360 230 Z" fill="var(--accent)" opacity="0.22" data-beat="5" data-anim="fade"/>
        <rect class="stroke muted" x="10" y="10" width="580" height="420" rx="30"/>
        <path class="stroke" d="M230 10 L190 430 M420 10 L360 230 L190 430" data-beat="0" data-anim="draw"/>
        <g font-size="42" font-weight="700" fill="var(--ink)">
          <text x="70" y="230">E₁</text><text x="260" y="150">E₂</text><text x="420" y="330">E₃</text>
        </g>
      </svg>
      <div class="col grow">
        <div class="steps">
        <div class="step" data-beat="2">aucun impossible : $P(E_i) &gt; 0$</div>
        <div class="step" data-beat="3">incompatibles 2 à 2 : $P(E_i \cap E_j) = 0$</div>
        <div class="step" data-beat="4">$E_1 \cup E_2 \cup \dots \cup E_n = \Omega$</div>
        </div>
        <div class="analogy" data-beat="5">
          <div class="icon">🧩</div>
          <div><b>Un puzzle</b><br><span class="muted">sans chevauchement, sans trou</span></div>
        </div>
      </div>

  - id: s11_exhaustif_ex
    notion: 'Système exhaustif'
    tag: 'Notion 5 / 7'
    title: 'Exhaustif ou pas ?'
    subtitle: 'On tire une carte dans un jeu de 52'
    hold: 0.6
    beats:
      - "Testons avec un jeu de 52 cartes. Cœurs, carreaux, et cartes noires : c'est un système exhaustif. Pas de chevauchement, et toutes les cartes sont couvertes."
      - "Cœurs et cartes noires : ce n'est pas exhaustif. Il manque les carreaux : il y a un trou."
      - "Images, rouges, et noires : pas exhaustif non plus. Un roi de cœur est à la fois une image et une carte rouge : il y a un chevauchement."
      - "Avec un dé, pairs et impairs forment un système exhaustif. Et en général, un événement et son contraire en forment toujours un."
      - "Dernier point : les branches qui partent d'un même sommet d'un arbre forment toujours un système exhaustif."
    html: |
      <div class="col w100">
        <table class="data">
          <tr><th>système</th><th>exhaustif ?</th><th>pourquoi</th></tr>
          <tr data-beat="0"><td>{cœurs, carreaux, noires}</td><td style="color:var(--olive)"><b>oui</b></td><td>ni trou, ni chevauchement</td></tr>
          <tr data-beat="1"><td>{cœurs, noires}</td><td class="accent"><b>non</b></td><td>trou : les carreaux</td></tr>
          <tr data-beat="2"><td>{images, rouges, noires}</td><td class="accent"><b>non</b></td><td>chevauchement : roi de cœur</td></tr>
          <tr data-beat="3"><td>{pairs, impairs} · {$A$, $\overline{A}$}</td><td style="color:var(--olive)"><b>oui</b></td><td>toujours</td></tr>
        </table>
        <div class="keep" data-beat="4">branches d'un même sommet = système exhaustif</div>
      </div>

  # ================================================================ NOTION 6 : THÉORÈME DES PROBABILITÉS TOTALES
  - id: s12_totales
    notion: 'Probabilités totales'
    tag: 'Notion 6 / 7'
    title: 'Le théorème des probabilités totales'
    subtitle: 'La formule générale'
    hold: 0.6
    beats:
      - "Soit un système exhaustif E 1 à E n, et un événement A de la même expérience."
      - "Alors P de A égale la somme, pour i allant de 1 à n, de P de E i fois P de A sachant E i."
      - "P de E i, c'est la probabilité de chaque cas. P de A sachant E i, la probabilité de A dans ce cas."
      - "L'idée : A se découpe en morceaux, A inter E 1, A inter E 2, et ainsi de suite. Ces morceaux sont disjoints, donc on additionne leurs probabilités."
      - "Et chaque morceau se calcule avec le théorème de multiplication. Pour le bus : E 1 le week-end, E 2 lundi ou vendredi, E 3 les trois autres jours."
    html: |
      <div class="col w60">
        <div class="card main" data-beat="1">
          <div class="formula">$$P(A) = \sum_{i=1}^{n} \htmlData{hl=2}{P(E_i)} \cdot \htmlData{hl=2+2.5}{P(A / E_i)}$$</div>
        </div>
        <div class="legend" data-beat="2">
          <span class="sym">$P(E_i)$</span><span>probabilité du cas $i$</span>
          <span class="sym">$P(A/E_i)$</span><span>probabilité de $A$ dans ce cas</span>
        </div>
      </div>
      <div class="col grow">
        <div class="calc" data-beat="0">$\{E_1, \dots, E_n\}$ exhaustif</div>
        <div class="calc" data-beat="3">$A = \bigcup_i \,(A \cap E_i)$ disjoints</div>
        <div class="chips" data-beat="4"><span class="chip">$E_1$ we</span><span class="chip">$E_2$ lu/ve</span><span class="chip">$E_3$ ma/me/je</span></div>
      </div>

  # ================================================================ NOTION 7 : BAYES
  - id: s13_bayes
    notion: 'Théorème de Bayes'
    tag: 'Notion 7 / 7'
    title: 'Le théorème de Bayes'
    subtitle: 'Remonter de la conséquence à la cause'
    hold: 0.6
    beats:
      - "Jusqu'ici, on partait du cas, le jour, pour calculer la conséquence, le bus à l'heure."
      - "Le théorème de Bayes inverse le point de vue. Sachant que A s'est produit, quelle est la probabilité qu'il se soit produit dans le cas E k ?"
      - "Pense à un détective : il voit la conséquence, et il remonte à la cause la plus probable."
      - "La formule : P de E k sachant A égale P de E k fois P de A sachant E k, divisé par P de A."
      - "Le numérateur vient du théorème de multiplication. Et le dénominateur, P de A, se calcule avec les probabilités totales."
    html: |
      <div class="col w40">
        <div class="row" data-beat="0">
          <div class="node">cause $E_k$</div><div class="arrow-r" data-anim="grow-x"></div><div class="node alt">effet $A$</div>
        </div>
        <div class="row" data-beat="1">
          <div class="node alt">effet $A$</div><div class="arrow-r" data-anim="grow-x"></div><div class="node red">cause ?</div>
        </div>
        <div class="analogy" data-beat="2">
          <div class="icon">🔎</div>
          <div><b>Le détective</b><br><span class="muted">de l'indice à la cause</span></div>
        </div>
      </div>
      <div class="col grow">
        <div class="card main" data-beat="3">
          <div class="formula">$$P(E_k / A) = \frac{\htmlData{hl=4}{P(E_k) \cdot P(A / E_k)}}{\htmlData{hl=4+3}{P(A)}}$$</div>
        </div>
        <div class="formula sm" data-beat="4+3">$$P(A) = \sum_{i=1}^{n} P(E_i) \cdot P(A/E_i)$$</div>
      </div>

  - id: s14_bayes_bus
    notion: 'Théorème de Bayes'
    tag: 'Notion 7 / 7'
    title: 'Exemple : c''était le week-end ?'
    subtitle: 'Le bus est arrivé à l''heure'
    hold: 0.6
    beats:
      - "Reprenons le bus. On sait que le bus est arrivé à l'heure. Quelle est la probabilité que ce soit un jour de week-end ?"
      - "Au numérateur : P de week-end, fois P d'être à l'heure sachant week-end. 2 sur 7 fois 0,9, soit environ 0,257."
      - "Au dénominateur : P d'être à l'heure, qu'on a déjà calculée : environ 0,771."
      - "0,257 divisé par 0,771, ça fait exactement 1 sur 3."
      - "Il y a donc une chance sur trois que ce soit le week-end. Sans cette information, on aurait dit 2 sur 7, soit environ 0,29."
    html: |
      <div class="col w100">
        <div class="calc" data-beat="0">$P(\text{week-end} / \text{à l'heure})$ ?</div>
        <div class="card main" data-beat="1">
          <div class="formula">$$\frac{\htmlData{hl=1+1}{\tfrac27 \times 0{,}9}}{\htmlData{beat=2}{0{,}771}} \htmlData{beat=3}{= \frac{0{,}257}{0{,}771} = \frac13}$$</div>
        </div>
        <div class="keep" data-beat="4">sachant « à l'heure » : <b>1 chance sur 3</b> que ce soit le week-end</div>
        <div class="calc muted" data-beat="4+3">sans information : $\tfrac27 \approx 0{,}29$</div>
      </div>

  - id: s15_arbre_inverse
    notion: 'Théorème de Bayes'
    tag: 'Notion 7 / 7'
    title: 'L''arbre inverse'
    subtitle: 'Les causes et les conséquences échangées'
    hold: 0.6
    beats:
      - "En calculant toutes les probabilités de ce type, on construit l'arbre inverse."
      - "Au premier niveau, la conséquence : à l'heure, avec 0,771, ou en retard, avec 0,229."
      - "Sachant que le bus est à l'heure : week-end 1 sur 3, lundi ou vendredi 2 sur 9, et les trois autres jours 4 sur 9."
      - "Sachant qu'il est en retard : week-end 1 sur 8, lundi ou vendredi 1 sur 2, et les trois autres jours 3 sur 8."
      - "Logique : quand le bus est en retard, il y a une chance sur deux que ce soit un lundi ou un vendredi, les jours de gros trafic."
    html: |
      <svg class="tree" viewBox="0 0 1000 560" width="1000" height="560">
        <g data-beat="1" data-anim="draw">
          <line class="stroke" x1="60" y1="280" x2="340" y2="150"/>
          <line class="stroke" x1="60" y1="280" x2="340" y2="410"/>
        </g>
        <g data-beat="2" data-anim="draw">
          <line class="stroke muted" x1="340" y1="150" x2="640" y2="50"/>
          <line class="stroke muted" x1="340" y1="150" x2="640" y2="150"/>
          <line class="stroke muted" x1="340" y1="150" x2="640" y2="250"/>
        </g>
        <g data-beat="3" data-anim="draw">
          <line class="stroke muted" x1="340" y1="410" x2="640" y2="310"/>
          <line class="stroke accent" x1="340" y1="410" x2="640" y2="410" stroke-width="7"/>
          <line class="stroke muted" x1="340" y1="410" x2="640" y2="510"/>
        </g>
        <circle cx="60" cy="280" r="10" fill="var(--ink)"/>
        <g data-beat="1">
          <text x="300" y="120" text-anchor="end">à l'heure</text><text class="p" x="110" y="190">0,771</text>
          <text x="300" y="470" text-anchor="end">en retard</text><text class="p" x="110" y="400">0,229</text>
        </g>
        <g data-beat="2">
          <text class="p" x="500" y="78">1/3</text><text x="660" y="62">week-end</text>
          <text class="p" x="500" y="140">2/9</text><text x="660" y="162">lu/ve</text>
          <text class="p" x="500" y="236">4/9</text><text x="660" y="262">ma/me/je</text>
        </g>
        <g data-beat="3">
          <text class="p" x="500" y="338">1/8</text><text x="660" y="322">week-end</text>
          <text class="p" x="500" y="400">1/2</text><text x="660" y="422" font-weight="700">lu/ve</text>
          <text class="p" x="500" y="496">3/8</text><text x="660" y="522">ma/me/je</text>
        </g>
      </svg>
      <div class="col grow">
        <div class="calc" data-beat="2">$\tfrac13 + \tfrac29 + \tfrac49 = 1$</div>
        <div class="calc" data-beat="3">$\tfrac18 + \tfrac12 + \tfrac38 = 1$</div>
        <div class="keep" data-beat="4">en retard → 1 chance sur 2 : <b>lundi ou vendredi</b></div>
      </div>

  # ================================================================ RÉCAP
  - id: s16_recap
    notion: 'Récapitulatif'
    title: 'Récap de la partie 2'
    beats:
      - "Récapitulons. La probabilité de A sachant B, c'est P de A inter B, divisé par P de B."
      - "Le théorème de multiplication donne le ET : P de A, fois P de B sachant A."
      - "Si A et B sont indépendants, on multiplie simplement : P de A fois P de B. Sans remise, dépendants ; avec remise, indépendants."
      - "Avec un système exhaustif, les probabilités totales : la somme des P de E i, fois P de A sachant E i. En arbre : on multiplie le long des chemins, et on additionne les chemins."
      - "Et Bayes remonte de la conséquence à la cause. Voilà, tu as toutes les bases du calcul des probabilités."
    html: |
      <div class="recap">
        <div class="item" data-beat="0"><span class="tex">$P(A/B) = \dfrac{P(A \cap B)}{P(B)}$</span></div>
        <div class="item" data-beat="1"><span class="tex">$P(A \cap B) = P(A) \cdot P(B/A)$</span></div>
        <div class="item" data-beat="2">indépendants : $P(A \cap B) = P(A) \cdot P(B)$</div>
        <div class="item" data-beat="3"><span class="tex">$P(A) = \sum_{i} P(E_i) \cdot P(A/E_i)$</span></div>
        <div class="item" data-beat="4"><span class="tex">$P(E_k/A) = \dfrac{P(E_k) \cdot P(A/E_k)}{P(A)}$</span></div>
      </div>
