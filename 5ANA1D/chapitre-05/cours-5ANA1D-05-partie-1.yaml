scenes:
  # ================================================================ TITRE
  - id: s00_titre
    layout: title
    notion: 'Introduction'
    beats:
      - "Analyse de données, chapitre 5 : introduction au calcul des probabilités."
      - "Dans cette première partie, on apprend le vocabulaire, deux façons de calculer une probabilité, et les opérations sur les événements."
    html: |
      <svg viewBox="0 0 560 560" width="560" height="560">
        <circle cx="280" cy="280" r="250" fill="var(--paper)" stroke="var(--line)" stroke-width="3"/>
        <g data-beat="1" data-anim="draw" data-dur="1.2">
          <rect class="stroke" x="150" y="170" width="220" height="220" rx="34"/>
          <rect class="stroke accent" x="250" y="250" width="160" height="160" rx="26"/>
        </g>
        <g data-beat="1+1.0" data-anim="pop">
          <circle cx="200" cy="220" r="16" fill="var(--main)"/>
          <circle cx="320" cy="220" r="16" fill="var(--main)"/>
          <circle cx="200" cy="340" r="16" fill="var(--main)"/>
          <circle cx="330" cy="330" r="13" fill="var(--accent)"/>
          <circle cx="370" cy="370" r="13" fill="var(--accent)"/>
          <circle cx="290" cy="290" r="13" fill="var(--accent)"/>
        </g>
      </svg>

  # ================================================================ INTRO
  - id: s01_intro
    notion: 'Introduction'
    title: 'Chiffrer le hasard'
    subtitle: 'Des jeux de hasard à la météo'
    beats:
      - "Calculer une probabilité, c'est chiffrer la chance qu'un événement soumis au hasard se réalise."
      - "Tout a commencé avec les jeux de hasard : les joueurs voulaient estimer leurs chances de gagner."
      - "L'exemple type, c'est le pile ou face. Tout le monde sait qu'on a une chance sur deux d'obtenir pile."
      - "Mais le hasard est partout : un tirage au sort, croiser quelqu'un dans la rue, la météo du week-end prochain."
      - "Un dicton résume bien l'enjeu : la loterie est une taxe sur ceux qui ne comprennent rien aux probabilités."
    html: |
      <div class="col w50">
        <div class="def" data-beat="0"><div class="term">Probabilité</div>chiffrer la chance qu'un événement se réalise</div>
        <div class="analogy" data-beat="2">
          <div class="icon">🪙</div>
          <div><b>Pile ou face</b><br><span class="muted">une chance sur deux : $\tfrac{1}{2}$</span></div>
        </div>
      </div>
      <div class="col w50">
        <div class="chips" data-beat="1"><span class="chip main">🎲 jeux de hasard</span></div>
        <div class="chips" data-beat="3"><span class="chip">🎟️ tirage au sort</span><span class="chip">🌦️ météo</span></div>
        <div class="card accent" data-beat="4"><div class="label">Anon.</div>« La loterie est une taxe sur les personnes qui ne comprennent rien aux probabilités »</div>
      </div>

  # ================================================================ NOTION 1 : EXPÉRIENCE ET Ω
  - id: s02_experience
    notion: 'Terminologie'
    tag: 'Notion 1 / 11'
    title: 'Expérience aléatoire et Ω'
    subtitle: 'Une action + ce que l''on note'
    hold: 0.5
    beats:
      - "Une expérience aléatoire, c'est un processus dont on ne peut pas connaître le résultat à l'avance."
      - "Pour être complète, elle décrit une action, et ce qu'on note comme résultat."
      - "Par exemple, jeter un dé et noter le point. Les résultats possibles sont 1, 2, 3, 4, 5 et 6."
      - "Avec la même action, on peut noter autre chose : la parité du point. Les résultats deviennent pair ou impair. C'est une autre expérience."
      - "L'ensemble de tous les résultats possibles s'appelle l'ensemble des possibilités. On le note oméga."
      - "Il peut être discret, comme pour le dé, continu, comme la longueur d'un saut entre 0 et 10 mètres, ou qualitatif, comme pile ou face."
    html: |
      <div class="col w50">
        <div class="def" data-beat="0"><div class="term">Expérience aléatoire</div>résultat impossible à connaître à l'avance</div>
        <div class="row" data-beat="1">
          <div class="node">action</div><span class="big">+</span><div class="node alt">résultat noté</div>
        </div>
        <div class="def" data-beat="4" style="border-top-color:var(--gold)"><div class="term">Ensemble des possibilités $\Omega$</div>tous les résultats possibles</div>
      </div>
      <div class="col w50">
        <div class="card" data-beat="2"><div class="label">Jeter un dé, noter le point</div>$\Omega = \{1, 2, 3, 4, 5, 6\}$</div>
        <div class="card" data-beat="3"><div class="label">Jeter un dé, noter la parité</div>$\Omega = \{\text{pair}, \text{impair}\}$</div>
        <div class="chips" data-beat="5"><span class="chip">discret</span><span class="chip">continu : $[0, 10]$</span><span class="chip">qualitatif</span></div>
      </div>

  - id: s03_evenement
    notion: 'Terminologie'
    tag: 'Notion 1 / 11'
    title: 'Événement aléatoire'
    subtitle: 'Une partie de Ω'
    hold: 0.5
    beats:
      - "Un événement aléatoire, c'est une des issues possibles de l'expérience."
      - "Techniquement, c'est un sous-ensemble de oméga : on y met tous les résultats pour lesquels l'événement est réalisé."
      - "Exemple avec le dé : l'événement, le point est au moins 5, correspond au sous-ensemble 5, 6."
      - "Et l'événement, le point est pair, correspond au sous-ensemble 2, 4, 6."
      - "On note les événements avec des lettres majuscules : A, B, C."
    html: |
      <svg class="w50" viewBox="0 0 760 520" width="760" height="520" data-beat="0" data-anim="fade">
        <rect class="stroke muted" x="20" y="20" width="720" height="480" rx="40"/>
        <text x="50" y="80" font-size="48" fill="var(--muted)">Ω</text>
        <g font-size="58" font-weight="700" fill="var(--ink)" text-anchor="middle">
          <text x="170" y="200">1</text><text x="380" y="200">3</text><text x="590" y="200">5</text>
          <text x="170" y="400">2</text><text x="380" y="400">4</text><text x="590" y="400">6</text>
        </g>
        <rect class="stroke accent" x="525" y="110" width="130" height="340" rx="60" data-beat="2" data-anim="draw"/>
        <rect class="stroke gold" x="95" y="320" width="590" height="120" rx="55" data-beat="3" data-anim="draw"/>
      </svg>
      <div class="col w40">
        <div class="def" data-beat="1"><div class="term">Événement</div>un <b>sous-ensemble</b> de $\Omega$</div>
        <div class="calc" data-beat="2">au moins 5 : <span class="res">$\{5, 6\}$</span></div>
        <div class="calc" data-beat="3">pair : $\{2, 4, 6\}$</div>
        <div class="chips" data-beat="4"><span class="chip fill">$A$</span><span class="chip fill">$B$</span><span class="chip fill">$C$</span></div>
      </div>

  # ================================================================ NOTION 2 : PROBABILITÉ
  - id: s04_probabilite
    notion: 'Probabilité'
    tag: 'Notion 2 / 11'
    title: 'La probabilité P(A)'
    subtitle: 'Un nombre entre 0 et 1'
    hold: 0.5
    beats:
      - "La probabilité d'un événement A se note P de A. C'est un nombre réel entre 0 et 1, bornes comprises."
      - "Plus elle est proche de 1, plus l'événement a de chances de se réaliser. Plus elle est proche de 0, moins il en a."
      - "Deux cas extrêmes. Une probabilité nulle : l'événement est impossible. Une probabilité de 1 : il est certain."
      - "Avec la pièce : P de pile vaut 1 sur 2, et P de face aussi."
      - "P de, la pièce tombe sur pile ou sur face, vaut 1 : c'est certain. P de, la pièce ne retombe pas, vaut 0 : c'est impossible."
      - "Une probabilité, c'est donc une fonction qui associe à chaque événement un nombre entre 0 et 1."
    html: |
      <div class="col w100">
        <div class="formula" data-beat="0">$$0 \;\le\; P(A) \;\le\; 1$$</div>
        <svg viewBox="0 0 1500 170" width="1500" height="170" data-beat="1" data-anim="fade">
          <line class="stroke muted" x1="80" y1="80" x2="1420" y2="80" data-beat="1" data-anim="draw"/>
          <circle cx="80" cy="80" r="14" fill="var(--accent)"/>
          <circle cx="1420" cy="80" r="14" fill="var(--olive)"/>
          <circle cx="750" cy="80" r="14" fill="var(--main)" data-beat="3" data-anim="pop"/>
          <text x="80" y="150" font-size="38" text-anchor="middle" fill="var(--ink)">0</text>
          <text x="1420" y="150" font-size="38" text-anchor="middle" fill="var(--ink)">1</text>
          <text x="750" y="150" font-size="38" text-anchor="middle" fill="var(--main-ink)" data-beat="3">½ : pile</text>
          <text x="60" y="40" font-size="36" text-anchor="start" fill="var(--accent)" font-weight="700" data-beat="2">impossible</text>
          <text x="1440" y="40" font-size="36" text-anchor="end" fill="var(--olive)" font-weight="700" data-beat="2">certain</text>
        </svg>
        <div class="row">
          <div class="calc" data-beat="4">$P(\text{pile ou face}) = 1$</div>
          <div class="calc" data-beat="4+2.5">$P(\text{ne retombe pas}) = 0$</div>
        </div>
        <div class="keep" data-beat="5">$P$ : événement $\mapsto$ nombre entre 0 et 1</div>
      </div>

  # ================================================================ NOTION 3 : ÉQUIPROBABLES
  - id: s05_equiprobables
    notion: 'Équiprobabilité'
    tag: 'Notion 3 / 11'
    title: 'Événements équiprobables'
    subtitle: 'Même probabilité de se réaliser'
    hold: 0.5
    beats:
      - "Deux événements sont équiprobables s'ils ont la même probabilité de se réaliser."
      - "Avec une pièce bien équilibrée, pile et face sont équiprobables : 1 sur 2 chacun."
      - "Avec un dé normal, chaque point a la même probabilité : 1 sur 6."
      - "Mais avec un dé pipé, le 6 sort plus souvent que les autres. Les points ne sont plus équiprobables."
      - "Retiens bien cette notion : elle est cruciale pour la suite."
    html: |
      <div class="col w50">
        <div class="def" data-beat="0"><div class="term">Équiprobables</div>même probabilité</div>
        <div class="analogy" data-beat="3">
          <div class="icon">🎲</div>
          <div><b>Le dé pipé</b><br><span class="muted">le 6 sort plus souvent</span></div>
        </div>
      </div>
      <div class="col w50">
        <table class="data" data-beat="2">
          <tr><th>point</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr>
          <tr><td><b>dé normal</b></td><td>⅙</td><td>⅙</td><td>⅙</td><td>⅙</td><td>⅙</td><td>⅙</td></tr>
        </table>
        <div class="calc" data-beat="1">pile : $\tfrac12$ · face : $\tfrac12$</div>
        <div class="keep" data-beat="4">équiprobabilité = notion <b>cruciale</b></div>
      </div>

  # ================================================================ NOTION 4 : A PRIORI
  - id: s06_apriori
    notion: 'Probabilité a priori'
    tag: 'Notion 4 / 11'
    title: 'Probabilité a priori'
    subtitle: 'Compter les cas'
    hold: 0.5
    beats:
      - "Il existe deux façons de calculer une probabilité. La première, la probabilité a priori, est mathématique : on compte des cas."
      - "C'est la formule bien connue : P de A égale le nombre de cas favorables, divisé par le nombre de cas possibles."
      - "Un cas favorable, c'est un cas où l'événement A se réalise, parmi les cas possibles envisagés."
      - "La pièce : 2 cas possibles, pile ou face. Un seul est favorable. P de pile vaut 1 sur 2."
      - "Le dé, avec l'événement, au moins 5 : 6 cas possibles, et 2 favorables, le 5 et le 6. P vaut 2 sur 6, donc 1 sur 3."
    html: |
      <div class="col w60">
        <div class="card" data-beat="1">
          <div class="formula">$$P(A) = \frac{\htmlData{hl=2}{\text{nombre de cas favorables}}}{\text{nombre de cas possibles}}$$</div>
        </div>
        <div class="def" data-beat="2"><div class="term">Cas favorable</div>un cas où $A$ se réalise</div>
      </div>
      <div class="col w40">
        <div class="calc" data-beat="3">🪙 $P(\text{pile}) = \tfrac{1}{2}$</div>
        <div class="calc" data-beat="4">🎲 $P(\ge 5) = \tfrac{2}{6} = $ <span class="res">$\tfrac{1}{3}$</span></div>
      </div>

  - id: s07_piege
    notion: 'Probabilité a priori'
    tag: 'Notion 4 / 11 · attention'
    title: 'Le piège des deux dés'
    subtitle: 'Somme des points au moins 10'
    hold: 0.5
    beats:
      - "Attention, voici le piège du cours. On jette deux dés, et on veut la probabilité que la somme soit au moins 10."
      - "Oméga contient les sommes de 2 à 12 : ça fait 11 résultats. Trois sont favorables : 10, 11 et 12."
      - "On serait tenté de répondre 3 sur 11. Mais ce résultat est faux !"
      - "Pourquoi ? Parce que ces 11 sommes ne sont pas équiprobables."
      - "Pour faire 12, il faut que les deux dés tombent sur 6 : une seule façon."
      - "Pour faire 7, il y a six façons : 1 plus 6, 2 plus 5, 3 plus 4, et aussi 4 plus 3, 5 plus 2, 6 plus 1."
    html: |
      <div class="col w50">
        <div class="card" data-beat="1"><div class="label">Sommes possibles</div>$\Omega = \{2, 3, \dots, 12\}$ : 11 cas</div>
        <div class="calc" data-beat="2">$P = \tfrac{3}{11}$ ? <span class="res">FAUX</span></div>
        <div class="keep" data-beat="3">ces 11 cas ne sont <b>pas équiprobables</b></div>
      </div>
      <div class="col w50">
        <div class="card" data-beat="4"><div class="label">Somme 12</div>6 + 6 : <b>1 façon</b></div>
        <div class="card main" data-beat="5"><div class="label">Somme 7</div>1+6 · 2+5 · 3+4 · 4+3 · 5+2 · 6+1 : <b>6 façons</b></div>
      </div>

  - id: s08_tableau
    notion: 'Probabilité a priori'
    tag: 'Notion 4 / 11 · attention'
    title: 'La bonne méthode : 36 couples'
    subtitle: 'Remonter à des cas équiprobables'
    hold: 0.6
    beats:
      - "La solution, c'est de remonter plus loin dans l'expérience, jusqu'à des cas qui sont vraiment équiprobables."
      - "Ici, ce sont les couples dé 1, dé 2. Chaque dé a 6 valeurs, donc il y a 6 fois 6, soit 36 couples équiprobables."
      - "Le tableau donne la somme pour chaque couple. On repère les cases qui valent 10, 11 ou 12."
      - "Il y en a 6. La probabilité vaut donc 6 sur 36, soit 1 sur 6. C'est exactement ce que tu avais noté."
      - "D'où la formule améliorée : le nombre de cas favorables, divisé par le nombre de cas possibles équiprobables."
      - "Et cette formule suppose un dé parfait. Avec un dé truqué, elle ne s'applique plus."
    html: |
      <table class="data small dice" data-beat="0">
        <tr><th>dé1 \ dé2</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr>
        <tr><th>1</th><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td></tr>
        <tr><th>2</th><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td></tr>
        <tr><th>3</th><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td></tr>
        <tr><th>4</th><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td class="hl" data-hl="2">10</td></tr>
        <tr><th>5</th><td>6</td><td>7</td><td>8</td><td>9</td><td class="hl" data-hl="2+0.3">10</td><td class="hl" data-hl="2+0.6">11</td></tr>
        <tr><th>6</th><td>7</td><td>8</td><td>9</td><td class="hl" data-hl="2+0.9">10</td><td class="hl" data-hl="2+1.2">11</td><td class="hl" data-hl="2+1.5">12</td></tr>
      </table>
      <div class="col grow">
        <div class="calc" data-beat="1">$6 \times 6 = 36$ couples équiprobables</div>
        <div class="calc" data-beat="3">$P(\text{somme} \ge 10) = \tfrac{6}{36} = $ <span class="res">$\tfrac{1}{6}$</span></div>
        <div class="card" data-beat="4">
          <div class="formula sm">$$P(A) = \frac{\text{nb de cas favorables}}{\text{nb de cas } \htmlData{hl=4+2}{\text{équiprobables}} \text{ possibles}}$$</div>
        </div>
        <div class="calc muted" data-beat="5">dé truqué → la formule ne s'applique pas</div>
      </div>

  # ================================================================ NOTION 5 : A POSTERIORI
  - id: s09_aposteriori
    notion: 'Probabilité a posteriori'
    tag: 'Notion 5 / 11'
    title: 'Probabilité a posteriori'
    subtitle: 'Observer au lieu de compter'
    hold: 0.5
    beats:
      - "Mais souvent, on ne peut pas compter de cas. Quelle est la probabilité de réussir un examen, ou que ton ordinateur plante ?"
      - "La seconde méthode, la probabilité a posteriori, se base sur l'expérience. On répète l'expérience n fois."
      - "On calcule la fréquence relative f n de A : le nombre de fois où A s'est réalisé, divisé par n."
      - "Plus n est grand, plus cette fréquence est fiable. La probabilité, c'est la limite de f n de A, quand n tend vers l'infini."
      - "Attention : la fréquence est expérimentale, la probabilité est théorique. On ne fait que s'en approcher."
      - "Le chapitre 7 le justifiera avec la loi des grands nombres."
    html: |
      <div class="col w50">
        <div class="chips" data-beat="0"><span class="chip">📝 réussir un examen</span><span class="chip">💻 l'ordinateur plante</span></div>
        <div class="card" data-beat="2">
          <div class="formula sm">$$f_n(A) = \frac{\text{nb de fois où } A \text{ se réalise}}{n}$$</div>
        </div>
        <div class="calc muted" data-beat="5">→ loi des grands nombres (chapitre 7)</div>
      </div>
      <div class="col w50">
        <div class="def" data-beat="1"><div class="term">A posteriori</div>on répète l'expérience $n$ fois</div>
        <div class="card main" data-beat="3">
          <div class="formula">$$P(A) = \htmlData{hl=3+2}{\lim_{n \to \infty}} f_n(A)$$</div>
        </div>
        <div class="keep" data-beat="4">fréquence = expérimentale · probabilité = théorique</div>
      </div>

  - id: s10_pieces
    notion: 'Probabilité a posteriori'
    tag: 'Notion 5 / 11'
    title: 'Exemple : 20 lancers de pièce'
    subtitle: 'La fréquence de pile se stabilise'
    hold: 0.6
    beats:
      - "Exemple du cours : on lance une pièce 20 fois, et on suit la fréquence de pile après chaque lancer."
      - "Au début, ça varie beaucoup : 1, puis 0,5, puis 0,67, puis 0,8 après cinq lancers."
      - "Ensuite, les variations diminuent. Après 20 lancers, on a 9 piles : la fréquence vaut 9 sur 20, soit 0,45."
      - "En continuant, la fréquence devrait se stabiliser autour de 0,5, ou d'une autre valeur si la pièce est truquée."
      - "Remarque : aux lancers 2, 14 et 16, la fréquence vaut pile 0,5. C'est un hasard. Seul le comportement à long terme compte."
    html: |
      <svg class="w60" viewBox="0 0 820 480" width="980" height="574">
        <line class="stroke muted" x1="50" y1="420" x2="800" y2="420"/>
        <line class="stroke muted" x1="50" y1="40" x2="50" y2="420"/>
        <line class="stroke gold" x1="50" y1="240" x2="800" y2="240" stroke-dasharray="12 10" data-beat="3" data-anim="draw"/>
        <text x="40" y="70" font-size="30" text-anchor="end" fill="var(--muted)">1</text>
        <text x="40" y="250" font-size="30" text-anchor="end" fill="var(--muted)">0,5</text>
        <text x="40" y="430" font-size="30" text-anchor="end" fill="var(--muted)">0</text>
        <text x="214" y="465" font-size="30" text-anchor="middle" fill="var(--muted)">5</text>
        <text x="394" y="465" font-size="30" text-anchor="middle" fill="var(--muted)">10</text>
        <text x="574" y="465" font-size="30" text-anchor="middle" fill="var(--muted)">15</text>
        <text x="754" y="465" font-size="30" text-anchor="middle" fill="var(--muted)">20</text>
        <polyline class="stroke" fill="none" stroke-width="3" opacity="0.45" points="70,60.0 106,240.0 142,180.0 178,150.0 214,132.0 250,180.0 286,162.9 322,195.0 358,220.0 394,204.0 430,223.6 466,210.0 502,226.2 538,240.0 574,228.0 610,240.0 646,250.6 682,260.0 718,249.5 754,258.0" data-beat="2" data-anim="draw" data-dur="1.6"/>
        <circle cx="70" cy="60.0" r="9" fill="var(--main)" data-beat="1+0.00" data-anim="pop"/>
        <circle cx="106" cy="240.0" r="9" fill="var(--main)" data-beat="1+0.6" data-anim="pop"/>
        <circle cx="142" cy="180.0" r="9" fill="var(--main)" data-beat="1+1.2" data-anim="pop"/>
        <circle cx="178" cy="150.0" r="9" fill="var(--main)" data-beat="1+1.6" data-anim="pop"/>
        <circle cx="214" cy="132.0" r="9" fill="var(--main)" data-beat="1+2.0" data-anim="pop"/>
        <circle cx="250" cy="180.0" r="9" fill="var(--main)" data-beat="2+0.00" data-anim="pop"/>
        <circle cx="286" cy="162.9" r="9" fill="var(--main)" data-beat="2+0.10" data-anim="pop"/>
        <circle cx="322" cy="195.0" r="9" fill="var(--main)" data-beat="2+0.20" data-anim="pop"/>
        <circle cx="358" cy="220.0" r="9" fill="var(--main)" data-beat="2+0.30" data-anim="pop"/>
        <circle cx="394" cy="204.0" r="9" fill="var(--main)" data-beat="2+0.40" data-anim="pop"/>
        <circle cx="430" cy="223.6" r="9" fill="var(--main)" data-beat="2+0.50" data-anim="pop"/>
        <circle cx="466" cy="210.0" r="9" fill="var(--main)" data-beat="2+0.60" data-anim="pop"/>
