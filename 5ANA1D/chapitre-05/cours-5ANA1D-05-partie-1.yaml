  - id: s11_pi_idee
    notion: 'Probabilité a posteriori'
    tag: 'Notion 5 / 11'
    title: 'Exemple : calculer π avec le hasard'
    subtitle: 'Un cercle dans un carré'
    hold: 0.5
    beats:
      - "Deuxième exemple, plus surprenant : calculer pi grâce au hasard."
      - "On dessine un cercle de rayon 1 dans un carré de côté 2, centré sur l'origine."
      - "On lance des points au hasard dans le carré : x et y sont choisis au hasard entre moins 1 et 1. Certains tombent dans le cercle, d'autres non."
      - "La probabilité de tomber dans le cercle, c'est le rapport des surfaces : la surface du cercle, divisée par celle du carré."
      - "Comme tu l'avais écrit : pi r carré, divisé par 2 r au carré, ça donne pi sur 4."
      - "Donc la fréquence des points dans le cercle tend vers pi sur 4. Il suffit de la multiplier par 4 pour approcher pi."
    html: |
      <svg class="w40" viewBox="0 0 560 480" width="640" height="548" data-beat="1" data-anim="fade">
        <rect class="stroke muted" x="90" y="50" width="380" height="380"/>
        <circle class="stroke" cx="280" cy="240" r="190" data-beat="1" data-anim="draw"/>
        <line class="stroke muted" x1="60" y1="240" x2="500" y2="240" stroke-width="2"/>
        <line class="stroke muted" x1="280" y1="20" x2="280" y2="460" stroke-width="2"/>
        <text x="478" y="230" font-size="30" fill="var(--muted)">1</text>
        <text x="50" y="230" font-size="30" fill="var(--muted)">−1</text>
        <circle cx="213" cy="373" r="7" fill="var(--main)" data-beat="2+0.00" data-anim="pop"/><circle cx="337" cy="402" r="7" fill="var(--main)" data-beat="2+0.06" data-anim="pop"/><circle cx="294" cy="291" r="7" fill="var(--main)" data-beat="2+0.12" data-anim="pop"/><circle cx="112" cy="237" r="7" fill="var(--main)" data-beat="2+0.18" data-anim="pop"/><circle cx="104" cy="265" r="7" fill="var(--main)" data-beat="2+0.24" data-anim="pop"/><circle cx="117" cy="396" r="7" fill="var(--accent)" data-beat="2+0.30" data-anim="pop"/><circle cx="251" cy="116" r="7" fill="var(--main)" data-beat="2+0.36" data-anim="pop"/><circle cx="137" cy="345" r="7" fill="var(--main)" data-beat="2+0.42" data-anim="pop"/><circle cx="328" cy="70" r="7" fill="var(--main)" data-beat="2+0.48" data-anim="pop"/><circle cx="309" cy="279" r="7" fill="var(--main)" data-beat="2+0.54" data-anim="pop"/><circle cx="461" cy="412" r="7" fill="var(--accent)" data-beat="2+0.60" data-anim="pop"/><circle cx="416" cy="320" r="7" fill="var(--main)" data-beat="2+0.66" data-anim="pop"/><circle cx="145" cy="385" r="7" fill="var(--accent)" data-beat="2+0.72" data-anim="pop"/><circle cx="207" cy="120" r="7" fill="var(--main)" data-beat="2+0.78" data-anim="pop"/><circle cx="159" cy="209" r="7" fill="var(--main)" data-beat="2+0.84" data-anim="pop"/><circle cx="333" cy="288" r="7" fill="var(--main)" data-beat="2+0.90" data-anim="pop"/><circle cx="298" cy="406" r="7" fill="var(--main)" data-beat="2+0.96" data-anim="pop"/><circle cx="113" cy="352" r="7" fill="var(--accent)" data-beat="2+1.02" data-anim="pop"/><circle cx="349" cy="268" r="7" fill="var(--main)" data-beat="2+1.08" data-anim="pop"/><circle cx="209" cy="207" r="7" fill="var(--main)" data-beat="2+1.14" data-anim="pop"/><circle cx="262" cy="316" r="7" fill="var(--main)" data-beat="2+1.20" data-anim="pop"/><circle cx="392" cy="164" r="7" fill="var(--main)" data-beat="2+1.26" data-anim="pop"/><circle cx="183" cy="212" r="7" fill="var(--main)" data-beat="2+1.32" data-anim="pop"/><circle cx="290" cy="97" r="7" fill="var(--main)" data-beat="2+1.38" data-anim="pop"/><circle cx="367" cy="321" r="7" fill="var(--main)" data-beat="2+1.44" data-anim="pop"/><circle cx="462" cy="385" r="7" fill="var(--accent)" data-beat="2+1.50" data-anim="pop"/><circle cx="249" cy="142" r="7" fill="var(--main)" data-beat="2+1.56" data-anim="pop"/><circle cx="148" cy="244" r="7" fill="var(--main)" data-beat="2+1.62" data-anim="pop"/><circle cx="105" cy="176" r="7" fill="var(--main)" data-beat="2+1.68" data-anim="pop"/><circle cx="381" cy="212" r="7" fill="var(--main)" data-beat="2+1.74" data-anim="pop"/><circle cx="423" cy="311" r="7" fill="var(--main)" data-beat="2+1.80" data-anim="pop"/><circle cx="354" cy="204" r="7" fill="var(--main)" data-beat="2+1.86" data-anim="pop"/><circle cx="310" cy="257" r="7" fill="var(--main)" data-beat="2+1.92" data-anim="pop"/><circle cx="409" cy="71" r="7" fill="var(--accent)" data-beat="2+1.98" data-anim="pop"/><circle cx="270" cy="178" r="7" fill="var(--main)" data-beat="2+2.04" data-anim="pop"/><circle cx="113" cy="163" r="7" fill="var(--main)" data-beat="2+2.10" data-anim="pop"/>
      </svg>
      <div class="col grow">
        <div class="calc" data-beat="2">$x, y$ au hasard dans $[-1, 1]$</div>
        <div class="card" data-beat="3">
          <div class="formula">$$P = \frac{S_{\text{cercle}}}{S_{\text{carré}}} \htmlData{beat=4}{= \frac{\pi r^2}{(2r)^2} = \frac{\pi}{4}}$$</div>
        </div>
        <div class="keep" data-beat="5">$4 \times f_n \longrightarrow \pi$</div>
      </div>

  - id: s12_pi_algo
    notion: 'Probabilité a posteriori'
    tag: 'Notion 5 / 11'
    title: 'L''algorithme ApproximationPi'
    subtitle: 'Compter les points dans le cercle'
    hold: 0.6
    beats:
      - "Voici l'algorithme du cours. On initialise un compteur à 0."
      - "Pour chacun des n points, on tire x et y au hasard entre moins 1 et 1. Rnd renvoie un réel aléatoire entre 0 et 1, donc 2 fois Rnd moins 1 tombe entre moins 1 et 1."
      - "Si x carré plus y carré est inférieur ou égal à 1, le point est dans le cercle : on augmente le compteur."
      - "À la fin, on renvoie 4 fois le compteur, divisé par n."
      - say: "J'ai exécuté cet algorithme. Avec 100 points, on obtient 3,12. Avec 100 000 points, on obtient 3,14."
        speak: "J'ai exécuté cet algorithme. Avec cent points, on obtient 3,12. Avec cent mille points, on obtient 3,14."
      - "Ce n'est pas la méthode la plus rapide pour calculer pi. Mais c'est étonnant : le hasard construit une suite qui converge vers une valeur exacte."
    html: |
      <pre class="code" style="width:1000px" data-lang="plaintext" data-reveal="0:1-4;1:5-7;2:8-10;3:11-12" data-hl-lines="2:8">module ApproximationPi(n : entier) → réel
        i, cpt : entier
        x, y : réel
        cpt ← 0
        pour i de 1 à n faire
          x ← 2*Rnd() – 1
          y ← 2*Rnd() – 1
          si x² + y² ≤ 1 alors
            cpt ← cpt + 1
          fin si
        fin pour
        retourner 4*cpt/n</pre>
      <div class="col grow">
        <table class="data" data-beat="4">
          <tr><th>$n$</th><th>résultat</th></tr>
          <tr><td>100</td><td>3,12</td></tr>
          <tr><td>1 000</td><td>3,096</td></tr>
          <tr><td>10 000</td><td>3,121</td></tr>
          <tr class="tot"><td>100 000</td><td>3,140</td></tr>
        </table>
        <div class="keep" data-beat="5">le hasard converge vers $\pi$</div>
      </div>

  # ================================================================ NOTION 6 : ENSEMBLES
  - id: s13_ensembles
    notion: 'Événements et ensembles'
    tag: 'Notion 6 / 11'
    title: 'Événements et ensembles'
    subtitle: 'ET, OU, NON'
    hold: 0.5
    beats:
      - "Plus précisément, un événement est une proposition booléenne, comme, le dé tombe sur un point pair. Elle est vraie ou fausse selon le résultat."
      - "Comme en logique, c'est un prédicat. Et le sous-ensemble 2, 4, 6 est sa classe de vérité."
      - "C'est pourquoi on confond événements et ensembles. Les opérateurs logiques deviennent des opérations sur les ensembles."
      - "ET devient l'intersection. OU devient l'union. NON devient le complémentaire, noté avec une barre au-dessus."
      - "Et l'événement certain correspond à oméga tout entier. L'événement impossible correspond à l'ensemble vide."
    html: |
      <div class="col w50">
        <div class="card" data-beat="0"><div class="label">Proposition booléenne</div>« le point est pair » : vrai ou faux</div>
        <div class="calc" data-beat="1">classe de vérité : <span class="res">$\{2, 4, 6\}$</span></div>
        <div class="row" data-beat="4">
          <div class="node">certain = $\Omega$</div><div class="node red">impossible = $\varnothing$</div>
        </div>
      </div>
      <div class="col w50">
        <table class="data" data-beat="2">
          <tr><th>logique</th><th>ensembles</th></tr>
          <tr data-beat="3"><td>ET</td><td>$A \cap B$ <span class="muted">intersection</span></td></tr>
          <tr data-beat="3+1.2"><td>OU</td><td>$A \cup B$ <span class="muted">union</span></td></tr>
          <tr data-beat="3+2.4"><td>NON</td><td>$\overline{A}$ <span class="muted">complémentaire</span></td></tr>
        </table>
      </div>

  # ================================================================ NOTION 7 : ADDITION
  - id: s14_addition
    notion: 'Théorème d''addition'
    tag: 'Notion 7 / 11'
    title: 'Le théorème d''addition'
    subtitle: 'La probabilité du OU'
    hold: 0.5
    beats:
      - "Le théorème d'addition donne la probabilité de A union B, c'est-à-dire A ou B, au sens non exclusif."
      - "P de A union B égale P de A, plus P de B, moins P de A inter B."
      - "Pourquoi la soustraction ? Regarde le dessin. Quand on additionne A et B, la zone commune est comptée deux fois."
      - "On la retire donc une fois. C'est tout le théorème."
    html: |
      <div class="col grow">
        <div class="card" data-beat="1">
          <div class="formula sm">$$P(A \cup B) = P(A) + P(B) \htmlData{hl=3}{- P(A \cap B)}$$</div>
        </div>
        <div class="keep" data-beat="3">la zone commune est comptée <b>deux fois</b> → on la retire une fois</div>
      </div>
      <svg viewBox="0 0 620 420" width="560" height="380" data-beat="0" data-anim="fade">
        <rect class="stroke muted" x="10" y="10" width="600" height="400" rx="34"/>
        <text x="34" y="60" font-size="38" fill="var(--muted)">Ω</text>
        <circle cx="240" cy="220" r="140" fill="var(--main)" opacity="0.25"/>
        <circle cx="380" cy="220" r="140" fill="var(--gold)" opacity="0.35"/>
        <circle class="stroke" cx="240" cy="220" r="140"/>
        <circle class="stroke" cx="380" cy="220" r="140"/>
        <text x="160" y="230" font-size="44" font-weight="700" fill="var(--ink)">A</text>
        <text x="440" y="230" font-size="44" font-weight="700" fill="var(--ink)">B</text>
        <path d="M310 98 A140 140 0 0 1 310 342 A140 140 0 0 1 310 98 Z" fill="var(--accent)" opacity="0.55" data-beat="2" data-anim="pop"/>
        <text x="310" y="232" font-size="34" font-weight="700" fill="var(--paper)" text-anchor="middle" data-beat="2">×2</text>
      </svg>

  - id: s15_addition_ex
    notion: 'Théorème d''addition'
    tag: 'Notion 7 / 11'
    title: 'Exemple : pair OU au moins 5'
    subtitle: 'Avec un dé'
    hold: 0.6
    beats:
      - "Exemple avec un dé. A : le point est pair. B : le point est au moins 5."
      - "P de A vaut 3 sur 6, avec 2, 4 et 6. P de B vaut 2 sur 6, avec 5 et 6."
      - "A inter B, c'est pair et au moins 5 : seulement le 6. Donc P de A inter B vaut 1 sur 6."
      - "On applique : 3 sur 6, plus 2 sur 6, moins 1 sur 6. Ça fait 4 sur 6, donc 2 sur 3."
      - "Vérifions en comptant directement : A union B, c'est 2, 4, 5, 6. Quatre cas sur six. C'est bien 2 sur 3."
    html: |
      <div class="col w40">
        <div class="calc" data-beat="0">$A$ = pair · $B$ = au moins 5</div>
        <div class="calc" data-beat="1">$P(A) = \tfrac36$ · $P(B) = \tfrac26$</div>
        <div class="calc" data-beat="2">$A \cap B = \{6\}$ → $P(A \cap B) = \tfrac16$</div>
      </div>
      <div class="col grow">
        <div class="card main" data-beat="3">
          <div class="formula sm">$$P(A \cup B) = \frac36 + \frac26 - \frac16 = \htmlData{hl=3+2}{\frac46 = \frac23}$$</div>
        </div>
        <div class="row" data-beat="4">
          <span class="chip fill">2</span><span class="chip fill">4</span><span class="chip fill">5</span><span class="chip fill">6</span>
          <span class="big">→ <span class="accent"><b>4 / 6</b></span> ✔</span>
        </div>
      </div>

  # ================================================================ NOTION 8 : INCOMPATIBLES
  - id: s16_incompatibles
    notion: 'Événements incompatibles'
    tag: 'Notion 8 / 11'
    title: 'Événements incompatibles'
    subtitle: 'Impossible en même temps'
    hold: 0.5
    beats:
      - "Deux événements sont incompatibles s'ils ne peuvent pas se produire en même temps."
      - "En ensembles, leur intersection est vide. On dit aussi qu'ils sont mutuellement exclusifs, ou disjoints."
      - "Dans ce cas, P de A inter B vaut 0. Le théorème d'addition se simplifie : P de A union B égale P de A plus P de B."
      - "Exemple avec le dé. A : le point est 1. B : le point est au moins 5. Ils ne peuvent pas arriver ensemble."
      - "Donc P de A union B vaut 1 sur 6, plus 2 sur 6, c'est-à-dire 3 sur 6, soit 1 sur 2."
    html: |
      <svg class="w40" viewBox="0 0 620 400" width="620" height="400" data-beat="1" data-anim="fade">
        <rect class="stroke muted" x="10" y="10" width="600" height="380" rx="34"/>
        <text x="34" y="60" font-size="38" fill="var(--muted)">Ω</text>
        <circle class="stroke" cx="180" cy="210" r="125" fill="var(--main)" fill-opacity="0.2"/>
        <circle class="stroke" cx="440" cy="210" r="125" fill="var(--gold)" fill-opacity="0.3"/>
        <text x="180" y="225" font-size="44" font-weight="700" text-anchor="middle" fill="var(--ink)">A</text>
        <text x="440" y="225" font-size="44" font-weight="700" text-anchor="middle" fill="var(--ink)">B</text>
      </svg>
      <div class="col grow">
        <div class="def" data-beat="0"><div class="term">Incompatibles</div>$A \cap B = \varnothing$ <span class="muted">· disjoints</span></div>
        <div class="card" data-beat="2">
          <div class="formula sm">$$P(A \cup B) = P(A) + P(B)$$</div>
        </div>
        <div class="calc" data-beat="3">$A$ = « 1 » · $B$ = « au moins 5 »</div>
        <div class="calc" data-beat="4">$\tfrac16 + \tfrac26 = \tfrac36 = $ <span class="res">$\tfrac12$</span></div>
      </div>

  # ================================================================ NOTION 9 : COMPLÉMENTAIRE
  - id: s17_complementaire
    notion: 'Événement complémentaire'
    tag: 'Notion 9 / 11'
    title: 'L''événement complémentaire'
    subtitle: 'La négation de A'
    hold: 0.5
    beats:
      - "Le complémentaire de A, c'est sa négation. On le note A barre."
      - "Par exemple, le complémentaire de, le point est au moins 5, c'est, le point est au plus 4."
      - "En ensembles, c'est tout ce qui est dans oméga, mais pas dans A."
      - "Propriété : P de A barre égale 1 moins P de A."
      - "Pourquoi ? A et A barre sont incompatibles, et leur union, c'est oméga, dont la probabilité vaut 1. Donc P de A plus P de A barre vaut 1."
    html: |
      <svg class="w40" viewBox="0 0 600 420" width="600" height="420" data-beat="0" data-anim="fade">
        <rect x="10" y="10" width="580" height="400" rx="34" fill="var(--gold)" fill-opacity="0.35" data-beat="2" data-anim="fade"/>
        <rect class="stroke muted" x="10" y="10" width="580" height="400" rx="34"/>
        <circle cx="250" cy="210" r="135" fill="var(--paper)"/>
        <circle class="stroke" cx="250" cy="210" r="135"/>
        <text x="34" y="60" font-size="38" fill="var(--muted)">Ω</text>
        <text x="250" y="225" font-size="48" font-weight="700" text-anchor="middle" fill="var(--ink)">A</text>
        <text x="500" y="370" font-size="44" font-weight="700" text-anchor="middle" fill="var(--main-ink)" data-beat="2">Ā</text>
      </svg>
      <div class="col grow">
        <div class="calc" data-beat="1">« au moins 5 » → « au plus 4 »</div>
        <div class="def" data-beat="2"><div class="term">$\overline{A}$</div>dans $\Omega$ mais pas dans $A$</div>
        <div class="card main" data-beat="3">
          <div class="formula">$$P(\overline{A}) = 1 - P(A)$$</div>
        </div>
        <div class="calc" data-beat="4">$P(A) + P(\overline{A}) = P(\Omega) = 1$</div>
      </div>

  - id: s18_complementaire_ex
    notion: 'Événement complémentaire'
    tag: 'Notion 9 / 11'
    title: 'Exemples : passer par le contraire'
    subtitle: 'Souvent plus rapide'
    hold: 0.6
    beats:
      - "Premier exemple : P de, au moins 5, vaut 1 sur 3. Donc P de, au plus 4, vaut 1 moins 1 sur 3, soit 2 sur 3."
      - "Deuxième exemple, avec nos deux dés : quelle est la probabilité que la somme soit inférieure à 10 ?"
      - "Compter les 30 cases serait long. Mais c'est le contraire de, la somme est au moins 10, qui vaut 1 sur 6."
      - "Donc la réponse est 1 moins 1 sur 6, soit 5 sur 6."
      - "À retenir : quand un événement est compliqué à compter, calcule son contraire."
    html: |
      <div class="col w40">
        <div class="card" data-beat="0"><div class="label">Un dé</div>$P(\le 4) = 1 - \tfrac13 = $ <span class="res">$\tfrac23$</span></div>
        <div class="card" data-beat="1"><div class="label">Deux dés</div>$P(\text{somme} < 10)$ ?</div>
      </div>
      <div class="col grow">
        <div class="calc" data-beat="2">contraire : $P(\text{somme} \ge 10) = \tfrac16$</div>
        <div class="card main" data-beat="3">
          <div class="formula sm">$$P(\text{somme} < 10) = 1 - \frac16 = \frac56$$</div>
        </div>
        <div class="keep" data-beat="4">compliqué à compter ? calcule le <b>contraire</b></div>
      </div>

  # ================================================================ RÉCAP
  - id: s19_recap
    notion: 'Récapitulatif'
    title: 'Récap de la partie 1'
    beats:
      - "Récapitulons. Une expérience aléatoire a un ensemble de possibilités oméga. Un événement est une partie de oméga, et sa probabilité est entre 0 et 1."
      - "La probabilité a priori compte les cas favorables, sur les cas possibles, à condition qu'ils soient équiprobables."
      - "La probabilité a posteriori est la limite de la fréquence relative, quand on répète l'expérience."
      - "Le théorème d'addition donne le OU. Pour des événements incompatibles, on additionne simplement."
      - "Et la probabilité du contraire vaut 1 moins P de A. Dans la partie 2, on verra les probabilités conditionnelles."
    html: |
      <div class="recap">
        <div class="item" data-beat="0"><b>Événement</b> : partie de $\Omega$ · $0 \le P(A) \le 1$</div>
        <div class="item" data-beat="1"><span class="tex">$P(A) = \dfrac{\text{favorables}}{\text{possibles équiprobables}}$</span></div>
        <div class="item" data-beat="2"><span class="tex">$P(A) = \lim_{n\to\infty} f_n(A)$</span></div>
        <div class="item" data-beat="3"><span class="tex">$P(A \cup B) = P(A) + P(B) - P(A \cap B)$</span></div>
        <div class="item" data-beat="3+2">incompatibles : $P(A \cup B) = P(A) + P(B)$</div>
        <div class="item" data-beat="4"><span class="tex">$P(\overline{A}) = 1 - P(A)$</span></div>
      </div>
