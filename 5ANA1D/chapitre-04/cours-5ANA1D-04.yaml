- id: s10_min_ecarts
  notion: Projeter sur une droite
  tag: Notion 5 / 9
  title: Étaler au max = coller au plus près
  subtitle: La somme des écarts au carré
  hold: 0.4
  beats:
  - Il y a une autre façon de voir ce meilleur axe. Mesurons l'écart de chaque point à la droite, perpendiculairement.
  - Pour chaque droite qui passe par le centre du nuage, on calcule deux sommes. L'étalement des projections, et la somme des écarts au carré.
  - 'Avec la droite horizontale : étalement 70, écarts 40. Avec la verticale : étalement 40, écarts 70.'
  - 'Avec le meilleur axe : étalement 80, écarts seulement 30. C''est le minimum.'
  - 'Remarque : la somme fait toujours 110. C''est Pythagore : chaque point se décompose en projection plus écart.'
  - Donc étaler les projections au maximum, c'est la même chose que rendre la somme des écarts au carré minimale.
  - 'Attention : cet axe est proche de la droite de régression du chapitre 3, mais pas identique. La régression mesure les écarts verticaux, l''ACP les écarts perpendiculaires.'
  html: |
    <div class="col w60">
      <table class="data" data-beat="1">
        <tr><th>droite par le centre</th><th>étalement</th><th>$\sum$ écarts²</th><th>total</th></tr>
        <tr data-beat="2"><td>horizontale</td><td>70</td><td>40</td><td class="hl" data-hl="4">110</td></tr>
        <tr data-beat="2+1.8"><td>verticale</td><td>40</td><td>70</td><td class="hl" data-hl="4">110</td></tr>
        <tr data-beat="3"><td><b>meilleur axe</b></td><td><b>80</b></td><td class="ring" data-hl="3+1"><b>30</b></td><td class="hl" data-hl="4">110</td></tr>
      </table>
      <div class="keep" data-beat="5">max étalement $\Leftrightarrow$ <b>min</b> $\sum$ écarts²</div>
    </div>
    <div class="col w40">
      <div class="card" data-beat="0"><div class="label">Écart</div>distance <b>perpendiculaire</b> du point à la droite</div>
      <div class="calc" data-beat="4">projection² + écart² = distance² au centre</div>
      <div class="card gold" data-beat="6"><div class="label">≠ régression</div>régression : écarts <b>verticaux</b><br>ACP : écarts <b>perpendiculaires</b></div>
    </div>
- id: s11_axe_combinaison
  notion: L'axe est une combinaison
  tag: Notion 6 / 9
  title: Le nouvel axe mélange X et Y
  subtitle: Une combinaison linéaire des 2 variables
  hold: 0.4
  beats:
  - Sur le meilleur axe, la position d'un point n'est plus x, ni y. C'est un mélange des deux.
  - 'On place d''abord l''origine au centre du nuage : la moyenne, 4 pour x et 6 pour y. Puis la position vaut deux fois x plus y, le tout divisé par racine de 5.'
  - 'Pour A : x moins 4 donne moins 3, y moins 6 donne moins 5. Deux fois moins 3, plus moins 5 : moins 11.'
  - On fait pareil pour les autres points. On obtient moins 6, moins 3, moins 1, 8 et 13.
  - Ces valeurs sont bien rangées dans l'ordre A, B, C, D, E, F.
  - 'À retenir : le nouvel axe est une combinaison linéaire de X et de Y. L''ACP sert à choisir au mieux ces axes.'
  html: |
    <div class="col w50">
      <div class="card main" data-beat="1"><div class="formula">$$z = \frac{2\,(x - \htmlData{hl=1}{4}) + (y - \htmlData{hl=1}{6})}{\sqrt{5}}$$</div></div>
      <div class="calc" data-beat="2">A : $2 \times (-3) + (-5) = $ <b>−11</b></div>
      <div class="keep" data-beat="5">Nouvel axe = <b>combinaison linéaire</b> de $X$ et $Y$</div>
    </div>
    <table class="data small w40">
      <tr><th>point</th><th>centré</th><th class="hl" data-hl="4">$2x + y$</th></tr>
      <tr data-beat="2"><td><b>A</b></td><td>(−3 ; −5)</td><td>−11</td></tr><tr data-beat="3"><td><b>B</b></td><td>(−4 ; 2)</td><td>−6</td></tr><tr data-beat="3"><td><b>C</b></td><td>(−2 ; 1)</td><td>−3</td></tr><tr data-beat="3"><td><b>D</b></td><td>(0 ; −1)</td><td>−1</td></tr><tr data-beat="3"><td><b>E</b></td><td>(4 ; 0)</td><td>8</td></tr><tr data-beat="3"><td><b>F</b></td><td>(5 ; 3)</td><td>13</td></tr>
    </table>
- id: s12_cov_def
  notion: Matrice des variances-covariances
  tag: Notion 7 / 9
  title: La matrice des variances-covariances
  subtitle: L'outil de calcul de l'ACP
  hold: 0.3
  beats:
  - 'Comment l''ACP trouve-t-elle ces axes ? Elle part d''un tableau : la matrice des variances-covariances.'
  - Pour n variables X 1 à X n, la case en ligne i et en colonne j contient la covariance de X i et X j, notée sigma de X i, X j.
  - 'C''est la covariance s x y du chapitre 3 : la moyenne des produits des écarts à la moyenne.'
  - 'Sur la diagonale, i égale j : la covariance d''une variable avec elle-même, c''est sa variance.'
  - Comme la matrice des corrélations, elle est symétrique.
  html: |
    <div class="col w60">
      <div class="card main" data-beat="1"><div class="formula">$$\text{case } (i, j) = \htmlData{hl=2}{\sigma(X_i, X_j)}$$</div></div>
      <div class="calc" data-beat="3">diagonale : $\sigma(X_i, X_i) = $ <span class="res">variance de $X_i$</span></div>
      <div class="calc" data-beat="4">symétrique : $\sigma(X_i, X_j) = \sigma(X_j, X_i)$</div>
    </div>
    <div class="col w40">
      <div class="legend" data-beat="1+1.5">
        <span class="sym">$n$</span><span>nombre de variables</span>
        <span class="sym">$\sigma(X_i, X_j)$</span><span>covariance de $X_i$ et $X_j$</span>
      </div>
      <div class="def" data-beat="2" style="border-top-color:var(--gold)"><div class="term">Rappel chapitre 3</div>$s_{xy} = \frac{1}{n}\sum (x_i - \bar{x})(y_i - \bar{y})$</div>
    </div>
- id: s13_cov_exemple
  notion: Matrice des variances-covariances
  tag: Notion 7 / 9
  title: 'Exemple : les points A à F'
  subtitle: Une matrice 2 × 2
  hold: 0.4
  beats:
  - Calculons-la pour nos six points. Deux variables, donc une matrice deux sur deux.
  - 'Variance de X : la somme des x moins 4, au carré, vaut 70. Divisée par 6, ça donne 11,67.'
  - 'Variance de Y : la somme des y moins 6, au carré, vaut 40. Divisée par 6 : 6,67.'
  - 'Covariance de X et Y : la somme des produits des écarts vaut 20. Divisée par 6 : 3,33.'
  - 'On range tout ça : les variances sur la diagonale, la covariance dans les deux autres cases.'
  html: |
    <div class="col w50">
      <div class="calc" data-beat="1">$\sigma(X,X) = \frac{70}{6} = $ <b>11,67</b></div>
      <div class="calc" data-beat="2">$\sigma(Y,Y) = \frac{40}{6} = $ <b>6,67</b></div>
      <div class="calc" data-beat="3">$\sigma(X,Y) = \frac{20}{6} = $ <b>3,33</b></div>
    </div>
    <div class="card main w40" data-beat="4">
      <div class="formula">$$M = \begin{pmatrix} \htmlData{hl=4}{11{,}67} & 3{,}33 \\ 3{,}33 & \htmlData{hl=4}{6{,}67} \end{pmatrix}$$</div>
    </div>
- id: s14_propres_def
  notion: Valeurs et vecteurs propres
  tag: Notion 8 / 9
  title: Valeurs et vecteurs propres
  subtitle: Ils donnent les nouveaux axes
  hold: 0.3
  beats:
  - Ensuite, on cherche les valeurs propres et les vecteurs propres de cette matrice.
  - 'Petit rappel d''algèbre : u est un vecteur propre de M si M fois u donne le même vecteur u, multiplié par un nombre lambda.'
  - Ce nombre lambda est la valeur propre associée à u.
  - Les vecteurs propres donnent les nouveaux axes sur lesquels on va représenter les données.
  - 'Et voici la propriété clé : une valeur propre est égale à la variance des données projetées sur l''axe de son vecteur propre.'
  - Donc la plus grande valeur propre donne l'axe où les données sont le plus dispersées.
  html: |
    <div class="col w50">
      <div class="card main" data-beat="1"><div class="formula lg">$$M\,u = \htmlData{hl=2}{\lambda}\,u$$</div></div>
      <div class="legend" data-beat="2">
        <span class="sym">$u$</span><span>vecteur propre : <b>un nouvel axe</b></span>
        <span class="sym">$\lambda$</span><span>valeur propre associée</span>
      </div>
    </div>
    <div class="col w50">
      <div class="def" data-beat="3"><div class="term">Vecteurs propres</div>les nouveaux axes de représentation</div>
      <div class="card accent" data-beat="4"><div class="label">Propriété clé</div>$\lambda$ = <b>variance</b> des projections sur l'axe de $u$</div>
      <div class="keep" data-beat="5">Plus grande valeur propre = axe le plus <b>dispersé</b></div>
    </div>
- id: s15_propres_exemple
  notion: Valeurs et vecteurs propres
  tag: Notion 8 / 9
  title: 'Exemple : vérifions sur A à F'
  subtitle: Le vecteur (2 ; 1)
  hold: 0.4
  beats:
  - 'Testons le vecteur u 1 égale 2, 1 : c''est la direction de notre meilleur axe.'
  - 'M fois u 1 : 11,67 fois 2 plus 3,33 donne 26,67. Et 3,33 fois 2 plus 6,67 donne 13,33.'
  - Or 26,67 et 13,33, c'est exactement 13,33 fois 2, et 13,33 fois 1. Donc lambda 1 vaut 13,33.
  - Vérifions la propriété. Les positions sur l'axe étaient moins 11, moins 6, moins 3, moins 1, 8 et 13, divisées par racine de 5.
  - 'Leurs carrés font 400. Divisé par 5, puis par 6 points : 13,33. C''est bien la variance des projections.'
  - 'L''autre vecteur propre, moins 1, 2, donne lambda 2 égale 5. Et 13,33 plus 5 donne 18,33 : la somme des deux variances.'
  html: |
    <div class="col w50">
      <div class="calc" data-beat="1">$\begin{pmatrix} 11{,}67 & 3{,}33 \\ 3{,}33 & 6{,}67 \end{pmatrix}\begin{pmatrix} 2 \\ 1 \end{pmatrix} = \begin{pmatrix} 26{,}67 \\ 13{,}33 \end{pmatrix}$</div>
      <div class="calc" data-beat="2">$= 13{,}33 \times \begin{pmatrix} 2 \\ 1 \end{pmatrix}$ &nbsp;⇒ $\lambda_1 = $ <span class="res">13,33</span></div>
      <div class="calc" data-beat="5">$u_2 = (-1 ; 2)$ ⇒ $\lambda_2 = $ <b>5</b></div>
    </div>
    <div class="col w50">
      <div class="card gold" data-beat="3"><div class="label">Variance des projections</div>
        <div class="calc">$\frac{121 + 36 + 9 + 1 + 64 + 169}{5 \times 6} = \frac{400}{30} = $ <b>13,33</b></div>
      </div>
      <div class="calc" data-beat="5+2.5">$13{,}33 + 5 = 18{,}33 = 11{,}67 + 6{,}67$</div>
    </div>
- id: s16_pourcentage
  notion: Valeurs et vecteurs propres
  tag: Notion 8 / 9
  title: Combien d'information garde-t-on ?
  subtitle: Part de la variance totale
  hold: 0.4
  beats:
  - 'La variance totale, c''est la somme des variances : 18,33. C''est toute l''information du nuage.'
  - 'Si on projette sur l''axe X, on garde sa variance : 11,67, soit 64 pour cent.'
  - 'Sur l''axe Y : 6,67, soit 36 pour cent seulement.'
  - 'Sur l''axe du premier vecteur propre : 13,33, soit 73 pour cent. C''est le meilleur score possible pour une seule droite.'
  - 'À retenir : la part d''information gardée par un axe, c''est sa valeur propre divisée par la somme des valeurs propres.'
  html: |
    <div class="bars-wrap w50"><div class="bars">
