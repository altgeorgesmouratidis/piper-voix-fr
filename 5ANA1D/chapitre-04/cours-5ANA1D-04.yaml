- id: s07_idee
  notion: Idée de l'ACP
  tag: Notion 4 / 9
  title: L'idée de l'ACP
  subtitle: Choisir le meilleur angle de vue
  beats:
  - Revenons au principe. Imagine un nuage de points en trois dimensions, et tu veux le photographier.
  - Tu vas chercher l'angle de vue où les points sont le plus étalés. C'est là que tu les distingues le mieux.
  - 'Exemple : les sept étoiles de la Grande Ourse. Vues de la Terre, elles dessinent une sorte de casserole.'
  - Vues depuis une autre galaxie, ces mêmes étoiles auraient sans doute une forme complètement différente.
  - 'L''ACP fait exactement ça : elle cherche l''angle de vue qui étale le plus les données.'
  html: |
    <div class="col w40">
      <div class="analogy" data-beat="0">
        <div class="icon">📷</div>
        <div><b>Photographier un objet 3D</b><br><span class="muted">on perd une dimension</span></div>
      </div>
      <div class="card gold" data-beat="1"><div class="label">Le bon angle</div>points <b>le plus étalés</b></div>
    </div>
    <div class="col w60">
      <svg viewBox="0 0 700 420" width="700" height="420">
    <rect x="0" y="0" width="700" height="420" rx="28" fill="#2B2A3F"/>
    <polyline points="60,300 190,210 300,220 420,225 480,320 620,270 590,150 420,225" fill="none" stroke="#EBDCC5" stroke-width="2.5" opacity="0.7" data-beat="2+0.6" data-anim="draw"/>
    <circle cx="60" cy="300" r="9" fill="#FFFDF8" data-beat="2+0.0" data-anim="pop"/>
    <circle cx="190" cy="210" r="9" fill="#FFFDF8" data-beat="2+0.1" data-anim="pop"/>
    <circle cx="300" cy="220" r="9" fill="#FFFDF8" data-beat="2+0.2" data-anim="pop"/>
    <circle cx="420" cy="225" r="9" fill="#FFFDF8" data-beat="2+0.3" data-anim="pop"/>
    <circle cx="480" cy="320" r="9" fill="#FFFDF8" data-beat="2+0.4" data-anim="pop"/>
    <circle cx="620" cy="270" r="9" fill="#FFFDF8" data-beat="2+0.5" data-anim="pop"/>
    <circle cx="590" cy="150" r="9" fill="#FFFDF8" data-beat="2+0.6" data-anim="pop"/>
    </svg>
      <div class="calc" data-beat="3">vue d'ailleurs : <b>un tout autre profil</b></div>
      <div class="keep" data-beat="4">ACP : chercher l'angle de vue de <b>dispersion maximale</b>.</div>
