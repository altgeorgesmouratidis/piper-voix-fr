- id: s17_deux_axes
  notion: Représenter en 2D
  tag: Notion 9 / 9
  title: Passer en 2 dimensions
  subtitle: Les 2 plus grandes valeurs propres
  hold: 0.4
  beats:
  - Pour représenter les données dans un plan, on prend comme base les deux vecteurs propres des deux plus grandes valeurs propres.
  - Ce plan est celui où les données sont dispersées au maximum.
  - Revenons aux neuf élèves. Leur matrice des variances-covariances est une matrice quatre sur quatre. Elle a donc quatre valeurs propres.
  - 'Les voici : 28,71, puis 12,08, puis 0,04 et 0,01.'
  - 'Les deux premières gardent 70,3 plus 29,6 pour cent : 99,9 pour cent de l''information.'
  - 'À retenir : le plan des deux premiers vecteurs propres montre presque tout, en deux dimensions seulement.'
  html: |
    <div class="col w40">
      <div class="card main" data-beat="0"><div class="label">Base du plan</div>vecteurs propres des <b>2 plus grandes</b> $\lambda$</div>
      <div class="calc" data-beat="1">plan de <b>dispersion maximale</b></div>
      <div class="calc" data-beat="4">$70{,}3\,\% + 29{,}6\,\% = $ <span class="res">99,9 %</span></div>
      <div class="keep" data-beat="5">2 axes gardent presque <b>toute</b> l'information</div>
    </div>
    <div class="bars-wrap w50" data-beat="2"><div class="bars">
      <div class="bar top"><span>28,71</span><div class="fill" style="height:400px" data-beat="3" data-anim="grow-y"></div><span class="lbl">λ₁</span></div>
      <div class="bar top"><span>12,08</span><div class="fill" style="height:168px" data-beat="3+0.4" data-anim="grow-y"></div><span class="lbl">λ₂</span></div>
      <div class="bar"><span>0,04</span><div class="fill" style="height:4px" data-beat="3+0.8" data-anim="grow-y"></div><span class="lbl">λ₃</span></div>
      <div class="bar"><span>0,01</span><div class="fill" style="height:3px" data-beat="3+1.2" data-anim="grow-y"></div><span class="lbl">λ₄</span></div>
    </div></div>
- id: s18_interpretation
  notion: Représenter en 2D
  tag: Notion 9 / 9
  title: Que représentent ces 2 axes ?
  subtitle: On retrouve les sciences et les langues
  hold: 0.4
  beats:
  - Regardons les deux vecteurs propres. Chacun donne une combinaison linéaire des quatre cotes.
  - Le premier donne presque le même poids, environ 0,5, aux quatre cours. Il mesure le niveau général de l'élève.
  - Le second donne des poids négatifs aux sciences et positifs aux langues. Il oppose les langues aux sciences.
  - On retrouve l'intuition du début avec S et L. Mais cette fois, c'est le calcul qui a choisi les meilleurs axes.
  html: |
    <table class="data" style="white-space:nowrap">
      <tr><th></th><th>math</th><th>phys.</th><th>angl.</th><th>néer.</th><th>sens</th></tr>
      <tr data-beat="1"><th>$u_1$</th><td>0,51</td><td>0,50</td><td>0,49</td><td>0,50</td><td class="hl" data-hl="1+1.5">niveau général</td></tr>
      <tr data-beat="2"><th>$u_2$</th><td>−0,58</td><td>−0,38</td><td>0,65</td><td>0,32</td><td class="hl" data-hl="2+1.5">langues − sciences</td></tr>
    </table>
    <div class="col" style="width:460px">
      <div class="card gold" data-beat="0"><div class="label">Chaque axe</div>une combinaison des 4 cotes</div>
      <div class="keep" data-beat="3">L'ACP <b>calcule</b> les meilleurs axes.</div>
    </div>
- id: s19_recap
  notion: Récapitulatif
  title: Récap du chapitre 4
  beats:
  - Récapitulons.
  - Au-delà de trois variables, on ne peut plus dessiner les données. La matrice des corrélations montre déjà quelles variables se ressemblent.
  - Réduire le nombre de variables, c'est les remplacer par des combinaisons linéaires, pas les supprimer.
  - L'ACP cherche les axes où les projections sont le plus dispersées. Ça revient à rendre minimale la somme des écarts au carré.
  - On part de la matrice des variances-covariances. Ses vecteurs propres donnent les axes, et chaque valeur propre est la variance sur son axe.
  - Pour un plan, on garde les deux vecteurs propres des deux plus grandes valeurs propres.
  html: |
    <div class="recap">
      <div class="item" data-beat="1"><b>Matrice des corrélations</b> : case $(i,j) = r(X_i, X_j)$</div>
      <div class="item" data-beat="2"><b>Réduire</b> = combinaisons linéaires, ex. $S = \tfrac12\,\text{math} + \tfrac12\,\text{phys}$</div>
      <div class="item" data-beat="3"><b>Meilleur axe</b> : dispersion max ⇔ min $\sum$ écarts²</div>
      <div class="item" data-beat="4"><span class="tex">$M u = \lambda u$</span> &nbsp;avec $M_{ij} = \sigma(X_i, X_j)$, $\lambda$ = variance sur l'axe</div>
      <div class="item" data-beat="5"><b>En 2D</b> : vecteurs propres des 2 plus grandes $\lambda$</div>
    </div>
