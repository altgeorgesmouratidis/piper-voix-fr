- id: s01_intro
  notion: Introduction
  title: Trop de dimensions
  subtitle: Au-delà de 3 variables, on ne voit plus rien
  beats:
  - Au chapitre 2, on étudiait une seule variable. Ses valeurs tiennent sur une droite.
  - 'Au chapitre 3, on en étudiait deux. Chaque individu devient un point dans un plan : c''est le nuage de points.'
  - Avec trois variables, on obtient un nuage de points en trois dimensions. On peut encore l'imaginer.
  - Mais avec quatre variables ou plus, il faudrait un espace à quatre dimensions. Personne ne peut le dessiner.
  - L'analyse en composantes principales résout ce problème. Elle ramène les données à deux dimensions, en les déformant le moins possible.
  html: |
    <div class="col" style="width:1650px;align-items:center">
    <div class="row" style="gap:40px">
      <div class="node" data-beat="0" style="min-width:300px">1 variable<br><span class="muted">une droite</span></div>
      <div class="node" data-beat="1" style="min-width:300px">2 variables<br><span class="muted">un plan</span></div>
      <div class="node" data-beat="2" style="min-width:300px">3 variables<br><span class="muted">un nuage 3D</span></div>
      <div class="node red" data-beat="3" style="min-width:300px">4 variables<br><span class="muted">impossible à voir</span></div>
    </div>
    <div class="def" data-beat="4" style="width:1300px"><div class="term">Analyse en composantes principales (ACP)</div>représenter les données en dimension réduite, idéalement 2, en les déformant le moins possible</div>
    </div>
- id: s02_cotes
  notion: Données multidimensionnelles
  tag: Notion 1 / 9
  title: Un exemple à 4 variables
  subtitle: Les cotes de 9 élèves
  hold: 0.4
  beats:
  - 'Prenons les cotes de neuf élèves, dans quatre cours : math, physique, anglais et néerlandais.'
  - Chaque élève est donc décrit par quatre nombres. C'est un point dans un espace à quatre dimensions.
  - 'Première idée : ne garder que deux cours sur les quatre. Mais lesquels choisir ?'
  - Regarde les colonnes. Les cotes de math et de physique se ressemblent beaucoup.
  - Les cotes d'anglais et de néerlandais aussi. Un élève a un niveau proche dans les branches scientifiques, et proche dans les langues.
  html: |
    <table class="data small w50" data-beat="0">
      <tr><th>élève</th><th class="hl" data-hl="3">math</th><th class="hl" data-hl="3">phys.</th><th class="hl" data-hl="4">angl.</th><th class="hl" data-hl="4">néer.</th></tr>
      <tr><td>1</td><td>6</td><td>6</td><td>5</td><td>5</td></tr><tr><td>2</td><td>8</td><td>8</td><td>8</td><td>8</td></tr><tr><td>3</td><td>6</td><td>7</td><td>11</td><td>9,5</td></tr><tr><td>4</td><td>14,5</td><td>14,5</td><td>15,5</td><td>15</td></tr><tr><td>5</td><td>14</td><td>14</td><td>12</td><td>12,5</td></tr><tr><td>6</td><td>11</td><td>10</td><td>5,5</td><td>7</td></tr><tr><td>7</td><td>5,5</td><td>7</td><td>14</td><td>11,5</td></tr><tr><td>8</td><td>13</td><td>12,5</td><td>8,5</td><td>9,5</td></tr><tr><td>9</td><td>9</td><td>9,5</td><td>12,5</td><td>12</td></tr>
    </table>
    <div class="col w40">
      <div class="card" data-beat="1"><div class="label">Un élève</div>4 cotes = <b>un point en 4D</b></div>
      <div class="card gold" data-beat="2"><div class="label">Idée naïve</div>garder <b>2 cours</b> sur 4 : lesquels&nbsp;?</div>
      <div class="row" data-beat="3"><span class="chip main">math ≈ physique</span></div>
      <div class="row" data-beat="4"><span class="chip gold">anglais ≈ néerlandais</span></div>
    </div>
- id: s03_corr_def
  notion: Matrice des corrélations
  tag: Notion 2 / 9
  title: La matrice des corrélations
  subtitle: Toutes les corrélations dans un seul tableau
  beats:
  - Pour le voir précisément, on range toutes les corrélations dans un tableau. Un peu comme le tableau des distances entre villes, sur une carte routière.
  - Les variables sont notées X 1, X 2, jusqu'à X n. Ici, n vaut 4.
  - Dans la matrice des corrélations, la case en ligne i et en colonne j contient le coefficient de corrélation r entre X i et X j. C'est le r du chapitre 3.
  - 'Cette matrice est forcément symétrique : la corrélation de X i avec X j est la même que celle de X j avec X i.'
  - 'Et sa diagonale ne contient que des 1 : une variable est parfaitement corrélée avec elle-même.'
  html: |
    <div class="col w40">
      <div class="analogy" data-beat="0">
        <div class="icon">🗺️</div>
        <div><b>Tableau des distances</b><br><span class="muted">Bruxelles–Liège = Liège–Bruxelles</span></div>
      </div>
      <div class="legend" data-beat="1">
        <span class="sym">$X_1, \dots, X_n$</span><span>les $n$ variables</span>
        <span class="sym">$r(X_i, X_j)$</span><span>corrélation de $X_i$ et $X_j$</span>
      </div>
    </div>
    <div class="col w60">
      <div class="card main" data-beat="2"><div class="formula">$$\text{case } (i, j) = r(X_i, X_j)$$</div></div>
      <div class="calc" data-beat="3">symétrique : $r(X_i, X_j) = r(X_j, X_i)$</div>
      <div class="calc" data-beat="4">diagonale : $r(X_i, X_i) = $ <span class="res">1</span></div>
    </div>
- id: s04_corr_lecture
  notion: Matrice des corrélations
  tag: Notion 2 / 9
  title: Lire la matrice des corrélations
  subtitle: Les cotes des 9 élèves
  hold: 0.4
  beats:
  - Voici la matrice des corrélations pour nos neuf élèves.
  - 'Math et physique : 0,98. C''est presque une corrélation parfaite.'
  - 'Anglais et néerlandais : 0,95. Très forte aussi.'
  - 'Par contre, math et anglais : seulement 0,23. Le lien est faible.'
  - 'On voit donc deux groupes de cours : les sciences d''un côté, les langues de l''autre.'
  - 'À retenir : garder math et physique n''aurait aucun sens. Ces deux cours disent presque la même chose.'
  html: |
    <table class="data w50" data-beat="0">
      <tr><th></th><th>math</th><th>phys.</th><th>angl.</th><th>néer.</th></tr>
      <tr><th>math</th><td style="color:var(--muted)">1</td><td class="hl" data-hl="1">0,98</td><td class="ring" data-hl="3">0,23</td><td>0,51</td></tr><tr><th>phys.</th><td class="hl" data-hl="1">0,98</td><td style="color:var(--muted)">1</td><td>0,40</td><td>0,65</td></tr><tr><th>angl.</th><td class="ring" data-hl="3">0,23</td><td>0,40</td><td style="color:var(--muted)">1</td><td class="hl" data-hl="2">0,95</td></tr><tr><th>néer.</th><td>0,51</td><td>0,65</td><td class="hl" data-hl="2">0,95</td><td style="color:var(--muted)">1</td></tr>
    </table>
    <div class="col w40">
      <div class="row" data-beat="4"><span class="chip main">sciences : math, phys.</span></div>
      <div class="row" data-beat="4+0.6"><span class="chip gold">langues : angl., néer.</span></div>
      <div class="keep" data-beat="5">Deux variables très corrélées apportent <b>presque la même information</b>.</div>
    </div>
- id: s05_combinaison
  notion: Combinaisons linéaires
  tag: Notion 3 / 9
  title: Combiner au lieu de supprimer
  subtitle: 'Deux nouvelles variables : S et L'
  beats:
  - Pour passer à deux dimensions, on pourrait garder un cours scientifique et un cours de langue. Par exemple math et anglais.
  - 'On peut faire mieux : créer deux nouvelles variables qui résument les quatre.'
  - 'S est la moyenne de math et de physique : un demi de math, plus un demi de physique.'
  - 'L est la moyenne d''anglais et de néerlandais : un demi d''anglais, plus un demi de néerlandais.'
  - Exemple avec l'élève 3. Il a 6 en math et 7 en physique, donc S vaut 6,5.
  - Il a 11 en anglais et 9,5 en néerlandais, donc L vaut 10,25.
  - Une telle somme de variables multipliées par des nombres s'appelle une combinaison linéaire.
  html: |
    <div class="col w50">
      <div class="card" data-beat="0"><div class="label">Possible</div>garder <b>math</b> et <b>anglais</b></div>
      <div class="card main" data-beat="1">
        <div class="formula sm">$$\htmlData{hl=2}{S = \tfrac12\,\text{math} + \tfrac12\,\text{phys}}$$</div>
        <div class="formula sm" data-beat="3">$$\htmlData{hl=3}{L = \tfrac12\,\text{angl} + \tfrac12\,\text{néer}}$$</div>
      </div>
    </div>
    <div class="col w50">
      <div class="card gold" data-beat="4"><div class="label">Élève 3</div>
        <div class="calc">$S = \tfrac12 \times 6 + \tfrac12 \times 7 = $ <span class="res">6,5</span></div>
        <div class="calc" data-beat="5">$L = \tfrac12 \times 11 + \tfrac12 \times 9{,}5 = $ <b>10,25</b></div>
      </div>
      <div class="def" data-beat="6"><div class="term">Combinaison linéaire</div>somme de variables multipliées par des nombres</div>
    </div>
- id: s06_graphe_SL
