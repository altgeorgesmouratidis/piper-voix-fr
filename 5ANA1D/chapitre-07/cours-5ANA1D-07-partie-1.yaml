  # ================================================================ RÉCAP
  - id: s13_recap
    notion: 'Récapitulatif'
    title: 'À retenir'
    subtitle: 'La distribution normale, partie 1'
    hold: 1.2
    beats:
      - "Récapitulons. Une normale, X suit N de mu et sigma, c'est une courbe en cloche, symétrique, avec son sommet en mu."
      - "Ses points d'inflexion sont en mu moins sigma et mu plus sigma, et l'aire totale sous la courbe vaut 1."
      - "Une probabilité est une aire. Mais f n'a pas de primitive élémentaire : on passe par une table."
      - "Cette table est celle de la normale réduite, Z suit N de 0 et 1. Elle donne F de x, l'aire à gauche de x."
      - "Pour x négatif, F de moins x égale 1 moins F de x. Dans la partie 2, on verra comment utiliser cette table pour n'importe quelle normale."
    html: |
      <div class="recap w100">
        <div class="item" data-beat="0"><span class="tex">$X \sim N(\mu, \sigma)$</span> · cloche symétrique, sommet en $\mu$</div>
        <div class="item" data-beat="1">points d'inflexion en $\mu \pm \sigma$ · aire totale $= 1$</div>
        <div class="item" data-beat="2">probabilité = aire · pas de primitive → <b>table</b></div>
        <div class="item" data-beat="3"><span class="tex">$Z \sim N(0, 1)$</span> · <span class="tex">$F(x) = P[Z \le x]$</span></div>
        <div class="item" data-beat="4"><span class="tex">$F(-x) = 1 - F(x)$</span></div>
      </div>
