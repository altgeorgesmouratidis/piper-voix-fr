  - id: s09_maclaurin
    notion: 'Fonction de répartition'
    tag: 'Notion 5 / 7 · approximation'
    title: 'Approcher F(x)'
    subtitle: 'Une série de Mac Laurin'
    hold: 0.6
    beats:
      - "Comment approcher F ? Le plus simple est de remplacer l'exponentielle par un polynôme : son développement en série de Mac Laurin."
      - "En s'arrêtant à l'ordre 6, puis en intégrant, on obtient cette formule."
      - "Testons-la en x égale 0,5. Elle donne 0,6915. La table donne aussi 0,6915 : parfait."
      - "Mais en x égale 2, elle donne 0,9331, alors que la table donne 0,9772. C'est beaucoup trop loin."
      - "C'est pourquoi le cours précise que cette formule n'est satisfaisante que pour x entre moins 1 et 1. En pratique, on utilisera la table."
    html: |
      <div class="col w100">
      <div class="card" data-beat="1"><div class="formula">$$F(x) \approx \frac{1}{2} + \frac{1}{\sqrt{2\pi}}\left(x - \frac{1}{6}x^{3} + \frac{1}{40}x^{5} - \frac{1}{336}x^{7}\right)$$</div></div>
      <div class="row w100">
        <table class="data w50">
          <tr><th>$x$</th><th>formule</th><th>table</th></tr>
          <tr data-beat="2"><td>$0{,}5$</td><td>$0{,}6915$</td><td style="color:var(--olive);font-weight:700">$0{,}6915$</td></tr>
          <tr data-beat="3"><td>$2$</td><td>$0{,}9331$</td><td class="accent" style="font-weight:700">$0{,}9772$</td></tr>
        </table>
        <div class="keep grow" data-beat="4">valable seulement pour $|x| &lt; 1$</div>
      </div>
      </div>

  # ================================================================ NOTION 6 : TABLE
  - id: s10_table
    notion: 'Lire la table'
    tag: 'Notion 6 / 7'
    title: 'Lire la table'
    subtitle: 'F(x) pour x de 0 à 3'
    hold: 0.6
    beats:
      - "La table du cours donne F de x, arrondie à 4 décimales, pour x positif, de 0 à 3, par pas de 0,01. Voici un extrait."
      - "On découpe x en deux morceaux. L'unité et le premier chiffre après la virgule donnent la ligne."
      - "Le deuxième chiffre après la virgule donne la colonne."
      - "Exemple : F de 1,25. On prend la ligne 1,2, puis la colonne 0,05."
      - "À l'intersection, on lit 0,8944. La probabilité que Z soit inférieur ou égal à 1,25 vaut donc 0,8944."
      - "Au-delà de 3, F vaut presque 1 : 0,9987 en 3, et 1 en 4, à 4 décimales près."
    html: |
      <table class="data small" data-beat="0">
        <tr><th>$x$</th><th>0,02</th><th>0,03</th><th>0,04</th><th class="hl" data-hl="3">0,05</th><th>0,06</th></tr>
        <tr><th>1,0</th><td>0,8461</td><td>0,8485</td><td>0,8508</td><td>0,8531</td><td>0,8554</td></tr>
        <tr><th>1,1</th><td>0,8686</td><td>0,8708</td><td>0,8729</td><td>0,8749</td><td>0,8770</td></tr>
        <tr class="hl" data-hl="3"><th>1,2</th><td>0,8888</td><td>0,8907</td><td>0,8925</td><td class="ring" data-hl="4" style="font-weight:700">0,8944</td><td>0,8962</td></tr>
        <tr><th>1,3</th><td>0,9066</td><td>0,9082</td><td>0,9099</td><td>0,9115</td><td>0,9131</td></tr>
        <tr><th>1,4</th><td>0,9222</td><td>0,9236</td><td>0,9251</td><td>0,9265</td><td>0,9279</td></tr>
      </table>
      <div class="col grow">
        <div class="card" data-beat="1"><div class="label">Ligne</div><span class="big">$1{,}2$</span> <span class="muted">unité + 1<sup>re</sup> décimale</span></div>
        <div class="card gold" data-beat="2"><div class="label">Colonne</div><span class="big">$0{,}05$</span> <span class="muted">2<sup>e</sup> décimale</span></div>
        <div class="calc" data-beat="4">$F(1{,}25) = P[Z \le 1{,}25] =$ <span class="res">$0{,}8944$</span></div>
        <div class="calc" data-beat="5">$F(3) = 0{,}9987$ · $F(4) \approx 1$</div>
      </div>

  # ================================================================ NOTION 7 : NÉGATIFS
  - id: s11_negatifs
    notion: 'Valeurs négatives'
    tag: 'Notion 7 / 7'
    title: 'Et pour x négatif ?'
    subtitle: 'La symétrie à la rescousse'
    hold: 0.6
    beats:
      - "La table ne donne que des x positifs. Comment trouver F de moins 1 ?"
      - "F de moins 1, c'est l'aire à gauche de moins 1 : la queue de gauche."
      - "Comme la courbe est symétrique par rapport à 0, cette queue est égale à la queue de droite, l'aire à droite de 1."
      - "Or l'aire à droite de 1, c'est l'aire totale, qui vaut 1, moins l'aire à gauche de 1. C'est donc 1 moins F de 1."
      - "D'où la formule : F de moins x égale 1 moins F de x. Le cours l'écrit dans l'autre sens : F de x égale 1 moins F de moins x. C'est la même chose."
      - "Ici, F de 1 vaut 0,8413. Donc F de moins 1 vaut 1 moins 0,8413, soit 0,1587."
