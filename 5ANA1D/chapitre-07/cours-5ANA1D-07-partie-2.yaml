  # ================================================================ RÉCAP
  - id: s11_recap
    notion: 'Récapitulatif'
    title: 'À retenir'
    subtitle: 'La distribution normale, partie 2'
    hold: 1.2
    beats:
      - "Récapitulons. Pour utiliser la table avec X qui suit N de mu et sigma, on centre-réduit : Z égale X moins mu, sur sigma."
      - "La valeur z dit à combien d'écarts-types de la moyenne on se trouve, et Z suit N de 0 et 1."
      - "Sur un intervalle, la probabilité vaut F de b moins mu sur sigma, moins F de a moins mu sur sigma."
      - "Au-dessus d'un seuil, c'est 1 moins F. Et pour un z négatif, F de moins x égale 1 moins F de x."
      - "Enfin, les valeurs typiques : 68 % à un écart-type, 95 % à deux, 99,7 % à trois."
    html: |
      <div class="recap w100">
        <div class="item" data-beat="0"><span class="tex">$Z = \dfrac{X - \mu}{\sigma}$</span></div>
        <div class="item" data-beat="1">$z$ = nombre d'écarts-types · <span class="tex">$Z \sim N(0, 1)$</span></div>
        <div class="item" data-beat="2"><span class="tex">$P[a \le X \le b] = F\!\left(\frac{b-\mu}{\sigma}\right) - F\!\left(\frac{a-\mu}{\sigma}\right)$</span></div>
        <div class="item" data-beat="3"><span class="tex">$P[X &gt; b] = 1 - F\!\left(\frac{b-\mu}{\sigma}\right)$</span> · <span class="tex">$F(-x) = 1 - F(x)$</span></div>
        <div class="item" data-beat="4"><b>68 %</b> ($1\sigma$) · <b>95 %</b> ($2\sigma$) · <b>99,7 %</b> ($3\sigma$)</div>
      </div>
