  # ================================================================ INTRO
  - id: s01_probleme
    notion: 'Introduction'
    title: 'Une seule table pour toutes les normales'
    subtitle: 'Le problème à résoudre'
    hold: 0.5
    beats:
      - "Dans la partie 1, on a appris à lire la table de la normale réduite, Z suit N de 0 et 1."
      - "Mais nos œufs suivent N de 60 et 5. Et il existe une infinité de normales : une pour chaque couple mu, sigma."
      - "Pas question de faire une table pour chacune ! L'idée : transformer X en Z, pour se ramener à la seule table qu'on a."
      - "C'est comme dire : cet œuf est à deux écarts-types au-dessus de la moyenne, au lieu de dire : il pèse 70 grammes."
    html: |
      <div class="col w40">
        <div class="card main" data-beat="0"><div class="label">Table disponible</div><div class="formula">$$Z \sim N(0,\ 1)$$</div></div>
        <div class="card gold" data-beat="1"><div class="label">Nos œufs 🥚</div><div class="formula">$$X \sim N(60,\ 5)$$</div></div>
      </div>
      <div class="col grow">
        <div class="row" data-beat="2">
          <div class="node alt">$X$</div>
          <div class="arrow-r" data-anim="grow-x" data-beat="2+0.4"></div>
          <div class="node">$Z$</div>
          <div class="arrow-r" data-anim="grow-x" data-beat="2+0.8"></div>
          <div class="node ghost">table</div>
        </div>
        <div class="keep" data-beat="3">70 g = <b>2 écarts-types</b> au-dessus de la moyenne</div>
      </div>

  # ================================================================ NOTION 1 : CENTRER-RÉDUIRE
  - id: s02_centrer_reduire
    notion: 'Centrer et réduire'
    tag: 'Notion 1 / 4'
    title: 'Centrer et réduire'
    subtitle: 'Un changement d''origine et d''unité'
    hold: 0.6
    beats:
      - "La transformation s'écrit : Z égale X moins mu, divisé par sigma."
      - "D'abord, on soustrait mu : c'est un changement d'origine. La moyenne vient se placer en 0, car mu moins mu égale 0."
      - "Ensuite, on divise par sigma : c'est un changement d'unité. Un écart-type devient une unité, car sigma divisé par sigma égale 1."
      - "Tu as vu au chapitre 2 qu'un tel changement linéaire transforme la moyenne de la même façon, alors que l'écart-type ne subit que le changement d'unité."
      - "Résultat : Z a une moyenne 0 et un écart-type 1. Z suit la normale réduite, N de 0 et 1."
      - "Concrètement, la valeur z dit à combien d'écarts-types de la moyenne on se trouve."
    html: |
      <div class="col w50">
        <div class="card" data-beat="0"><div class="formula lg">$$Z = \frac{\htmlData{hl=1}{X - \mu}}{\htmlData{hl=2}{\sigma}}$$</div></div>
        <div class="card main" data-beat="4"><div class="formula">$$Z \sim N(0,\ 1)$$</div></div>
      </div>
      <div class="col grow">
        <div class="calc" data-beat="1"><b>origine</b> : $\mu - \mu = 0$</div>
        <div class="calc" data-beat="2"><b>unité</b> : $\sigma / \sigma = 1$</div>
        <div class="calc" data-beat="3"><span class="muted">chapitre 2 : changement linéaire</span></div>
        <div class="keep" data-beat="5">$z$ = nombre d'<b>écarts-types</b> par rapport à la moyenne</div>
      </div>

  - id: s03_echelle
    notion: 'Centrer et réduire'
    tag: 'Notion 1 / 4'
    title: 'Un simple changement d''échelle'
    subtitle: 'Deux axes, une seule courbe'
    hold: 0.6
