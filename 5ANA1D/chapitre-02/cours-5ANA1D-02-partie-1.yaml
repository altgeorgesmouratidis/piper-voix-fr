        <g data-beat="2" data-anim="draw">
          <line x1="60" y1="350" x2="275" y2="350" class="stroke gold" style="stroke-dasharray:10 8;stroke-width:4"/>
          <line x1="275" y1="350" x2="275" y2="440" class="stroke gold" style="stroke-dasharray:10 8;stroke-width:4"/>
        </g>
        <text x="0" y="360" style="font-size:28px;fill:var(--main-ink)" data-beat="2">0,25</text>
        <text x="222" y="415" style="font-size:30px;fill:var(--main-ink);font-weight:700" data-beat="2+1">65</text>
        <g data-beat="3" data-anim="draw">
          <line x1="60" y1="170" x2="483" y2="170" class="stroke accent" style="stroke-dasharray:10 8;stroke-width:4"/>
