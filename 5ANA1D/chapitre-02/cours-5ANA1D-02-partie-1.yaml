      <div class="col grow">
        <div class="card main" data-beat="1"><div class="label">3 quartiles</div>$F(x_{1/4}) = 0{,}25$ · $x_{1/2}$ · $F(x_{3/4}) = 0{,}75$</div>
        <div class="calc" data-beat="2">$x_{1/4} = $ <b>65</b> kg</div>
        <div class="calc" data-beat="3">$0{,}025\,(x - 75) + 0{,}6 = 0{,}75$ → <span class="res">81</span></div>
