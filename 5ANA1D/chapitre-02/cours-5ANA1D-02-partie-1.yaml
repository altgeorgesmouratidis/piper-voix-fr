  # ================================================================ NOTION 6 : MOYENNE
  - id: s11_moyenne
    notion: 'Moyenne'
    tag: 'Notion 6 / 7'
    title: 'La moyenne $\bar{x}$'
    subtitle: 'Trois écritures selon la présentation'
    beats:
      - "La moyenne arithmétique, notée x barre, n'existe que pour des observations quantitatives."
      - "Sur des données brutes : on additionne toutes les observations et on divise par n. Un sur n, fois la somme des x i, pour i allant de 1 à n."
      - "Dans un tableau recensé, chaque valeur x i compte n i fois. On fait la somme des n i fois x i, divisée par n."
      - "Ou, ce qui revient au même, la somme des f i fois x i. Ici, i va de 1 à k, le nombre de valeurs différentes."
      - "Exemple avec notre tableau : 30 fois 2, plus 40 fois 4, et ainsi de suite. On obtient 1030."
      - "On divise par 20 : la moyenne vaut 51,5. Proche de la médiane, qui valait 50."
    html: |
      <div class="col w50">
        <div class="card" data-beat="1" style="padding:22px 36px"><div class="label">Données brutes</div><div class="formula sm" style="font-size:44px;margin:0">$$\bar{x} = \frac{1}{n}\sum_{i=1}^{n} x_i$$</div></div>
        <div class="card main" data-beat="2" style="padding:22px 36px"><div class="label">Tableau recensé</div><div class="formula sm" style="font-size:44px;margin:0">$$\bar{x} = \frac{1}{n}\sum_{i=1}^{k} n_i\,x_i \htmlData{beat=3}{\;=\;\sum_{i=1}^{k} f_i\,x_i}$$</div></div>
      </div>
      <div class="col w50">
        <table class="data small" data-beat="4">
          <tr><th>$x_i$</th><th>$n_i$</th><th>$n_i x_i$</th></tr>
          <tr><td>30</td><td>2</td><td>60</td></tr>
          <tr><td>40</td><td>4</td><td>160</td></tr>
          <tr><td>50</td><td>6</td><td>300</td></tr>
          <tr><td>60</td><td>5</td><td>300</td></tr>
          <tr><td>70</td><td>3</td><td>210</td></tr>
          <tr class="tot"><td>Total</td><td>20</td><td data-beat="4+3" data-anim="count" data-to="1030">1030</td></tr>
        </table>
        <div class="calc" data-beat="5">$\bar{x} = \dfrac{1030}{20} = $ <span class="res">51,5</span></div>
      </div>

  - id: s12_moyenne_classes
    notion: 'Moyenne'
    tag: 'Notion 6 / 7'
    title: 'Moyenne de données en classes'
    subtitle: 'On remplace chaque classe par son centre'
    beats:
      - "En continu, on ne connaît pas les valeurs exactes dans chaque classe. On les remplace par le centre de classe, c i."
      - "Le centre, c'est la moyenne des deux bornes : x i moins 1, plus x i, divisé par 2. Pour 65 à 75, le centre vaut 70."
      - "Grâce à l'hypothèse d'uniformité, le centre représente bien la moyenne des observations de la classe."
      - "La formule devient : la somme des f i fois c i. C'est une moyenne des moyennes de chaque classe."
      - "Pour les poids : 0,25 fois 57,5, plus 0,35 fois 70, plus 0,25 fois 80, plus 0,15 fois 92,5."
      - "On obtient 72,75 kilos. Très proche de la médiane, 72,14."
    html: |
      <div class="col w40">
        <table class="data">
          <tr><th>Classe (kg)</th><th>$f_i$</th><th class="hl" data-hl="0">$c_i$</th></tr>
          <tr><td>[50, 65[</td><td>0,25</td><td data-beat="1+3">57,5</td></tr>
          <tr class="hl" data-hl="1"><td>[65, 75[</td><td>0,35</td><td data-beat="1">70</td></tr>
          <tr><td>[75, 85[</td><td>0,25</td><td data-beat="1+3.3">80</td></tr>
          <tr><td>[85, 100[</td><td>0,15</td><td data-beat="1+3.6">92,5</td></tr>
        </table>
        <div class="calc" data-beat="1">$c_i = \dfrac{x_{i-1} + x_i}{2}$</div>
      </div>
      <div class="col grow">
        <div class="card main" data-beat="3"><div class="formula sm">$$\bar{x} = \sum_{i=1}^{k} f_i\,c_i \quad \text{ou} \quad \frac{1}{n}\sum_{i=1}^{k} n_i\,c_i$$</div></div>
        <div class="calc" data-beat="4">$14{,}375 + 24{,}5 + 20 + 13{,}875$</div>
        <div class="calc" data-beat="5">$\bar{x} = $ <span class="res">72,75 kg</span></div>
      </div>

  # ================================================================ NOTION 7 : RÉUNION
  - id: s13_reunion
    notion: 'Moyenne'
    tag: 'Notion 7 / 7'
    title: 'Moyenne d''une réunion de groupes'
    subtitle: 'Sans tout recalculer'
    hold: 0.5
    beats:
      - "Deux groupes passent la même interro. Groupe A : 30 étudiants, moyenne 12. Groupe B : 20 étudiants, moyenne 15."
      - "Quelle est la moyenne de tous les étudiants ? Le piège, c'est de faire 12 plus 15, divisé par 2, donc 13,5. C'est faux."
      - "Le groupe A est plus nombreux, il doit peser plus. On multiplie chaque moyenne par l'effectif de son groupe."
      - "30 fois 12, plus 20 fois 15, ça fait 660. C'est la somme de toutes les notes."
      - "On divise par l'effectif total, 50. La moyenne globale vaut 13,2."
      - "La formule se généralise à k groupes : la somme des n i fois x barre i, divisée par la somme des n i."
    html: |
      <div class="col w40">
        <div class="row" data-beat="0">
          <div class="person"><div class="face">A</div>30 ét. · 12</div>
          <div class="person b"><div class="face">B</div>20 ét. · 15</div>
        </div>
        <div class="card accent" data-beat="1"><div class="label">⚠ Piège</div>$\dfrac{12 + 15}{2} = 13{,}5$ ✗</div>
      </div>
      <div class="col grow">
        <div class="card main" data-beat="2"><div class="formula sm">$$\bar{x} = \frac{n_1\bar{x}_1 + n_2\bar{x}_2}{n_1 + n_2}$$</div></div>
        <div class="calc" data-beat="3">$30 \times 12 + 20 \times 15 = 660$</div>
        <div class="calc" data-beat="4">$\bar{x} = \dfrac{660}{50} = $ <span class="res">13,2</span></div>
        <div class="calc" data-beat="5">$k$ groupes : $\dfrac{n_1\bar{x}_1 + \dots + n_k\bar{x}_k}{n_1 + \dots + n_k}$</div>
      </div>

  # ================================================================ RÉCAP
  - id: s14_recap
    notion: 'Récapitulatif'
    title: 'Récap de la partie 1'
    beats:
      - "Récapitulons. Le mode est la valeur la plus fréquente. En continu, c'est la classe de plus forte densité. Attention aux valeurs aberrantes."
      - "La médiane coupe les observations en deux moitiés. Données brutes : la valeur du milieu, ou la moyenne des deux valeurs centrales."
      - "Tableau recensé : le premier N i supérieur ou égal à n sur 2. En cas d'égalité, la moyenne de x i et de la valeur suivante."
      - "En continu : on résout F de x égale 0,5. Et 0,25 ou 0,75 pour les quartiles."
      - "La moyenne : la somme des f i fois x i, avec les centres de classe c i en continu. Pour réunir des groupes, on pondère par les effectifs."
      - "Dans la partie 2 : la dispersion, et d'autres types de moyennes."
    html: |
      <div class="recap">
        <div class="item" data-beat="0"><b>Mode</b> : plus fréquent · classe de plus forte $df_i$</div>
        <div class="item" data-beat="1"><b>Médiane</b> : $x_{(n+1)/2}$ ou $\frac{1}{2}(x_{n/2} + x_{n/2+1})$</div>
        <div class="item" data-beat="2">Tableau : 1er $N_i \geq n/2$ · égalité → $\frac{1}{2}(x_i + x_{i+1})$</div>
        <div class="item" data-beat="3">Continu : $F(x) = 0{,}5$ · quartiles $0{,}25$ et $0{,}75$</div>
        <div class="item" data-beat="4"><b>Moyenne</b> : <span class="tex">$\bar{x} = \sum f_i x_i$</span> ($c_i$ en continu)</div>
        <div class="item" data-beat="4+4"><b>Réunion</b> : <span class="tex">$\bar{x} = \frac{\sum n_i \bar{x}_i}{\sum n_i}$</span></div>
      </div>
