      <svg class="w50" viewBox="0 0 900 480" width="860" height="460">
        <polygon class="band3" points="150,420 150,417 161,416 172,414 183,412 194,410 205,407 216,403 227,399 238,393 249,387 260,379 271,371 282,361 293,349 304,337 315,323 326,307 337,291 348,274 359,256 370,238 381,220 392,202 403,185 414,169 425,155 436,143 447,133 458,126 469,121 480,120 491,121 502,126 513,133 524,143 535,155 546,169 557,185 568,202 579,220 590,238 601,256 612,274 623,291 634,307 645,323 656,337 667,349 678,361 689,371 700,379 711,387 722,393 733,399 744,403 755,407 766,410 777,412 788,414 799,416 810,417 810,420" fill="var(--gold)" opacity="0.30" data-beat="4" data-anim="fade"/>
        <polygon points="260,420 260,379 267,374 275,367 282,361 289,353 297,345 304,337 311,327 319,318 326,307 333,297 341,286 348,274 355,262 363,250 370,238 377,226 385,214 392,202 399,191 407,180 414,169 421,160 429,151 436,143 443,136 451,130 458,126 465,123 473,121 480,120 487,121 495,123 502,126 509,130 517,136 524,143 531,151 539,160 546,169 553,180 561,191 568,202 575,214 583,226 590,238 597,250 605,262 612,274 619,286 627,297 634,307 641,318 649,327 656,337 663,345 671,353 678,361 685,367 693,374 700,379 700,420" fill="var(--main)" opacity="0.35" data-beat="3" data-anim="fade"/>
        <polygon points="370,420 370,238 374,232 377,226 381,220 385,214 388,208 392,202 396,196 399,191 403,185 407,180 410,175 414,169 418,164 421,160 425,155 429,151 432,147 436,143 440,140 443,136 447,133 451,130 454,128 458,126 462,124 465,123 469,121 473,121 476,120 480,120 484,120 487,121 491,121 495,123 498,124 502,126 506,128 509,130 513,133 517,136 520,140 524,143 528,147 531,151 535,155 539,160 542,164 546,169 550,175 553,180 557,185 561,191 564,196 568,202 572,208 575,214 579,220 583,226 586,232 590,238 590,420" fill="var(--accent)" opacity="0.55" data-beat="2" data-anim="fade"/>
        <polyline points="90,419 96,419 103,419 110,419 116,419 122,418 129,418 136,418 142,417 148,417 155,416 162,415 168,415 174,414 181,413 188,411 194,410 200,408 207,406 214,404 220,402 226,399 233,396 240,393 246,389 252,385 259,380 266,375 272,370 278,364 285,358 292,351 298,344 304,336 311,328 318,319 324,310 330,301 337,291 344,281 350,271 356,260 363,250 370,239 376,228 382,217 389,207 396,197 402,187 408,177 415,168 422,160 428,152 434,145 441,138 448,133 454,128 460,125 467,122 474,121 480,120 486,121 493,122 500,125 506,128 512,133 519,138 526,145 532,152 538,160 545,168 552,177 558,187 564,197 571,207 578,217 584,228 590,239 597,250 604,260 610,271 616,281 623,291 630,301 636,310 642,319 649,328 656,336 662,344 668,351 675,358 682,364 688,370 694,375 701,380 708,385 714,389 720,393 727,396 734,399 740,402 746,404 753,406 760,408 766,410 772,411 779,413 786,414 792,415 798,415 805,416 812,417 818,417 824,418 831,418 838,418 844,419 850,419 857,419 864,419 870,419" fill="none" class="stroke" style="stroke-width:6" data-beat="1" data-anim="draw"/>
        <line class="stroke muted" x1="60" y1="420" x2="880" y2="420" style="stroke-width:3"/>
        <g style="font-size:30px;fill:var(--muted)">
          <text x="130" y="460" data-beat="4">15</text><text x="240" y="460" data-beat="3">20</text><text x="350" y="460" data-beat="2">25</text>
          <text x="460" y="460" style="fill:var(--ink);font-weight:700" data-beat="1">30</text>
          <text x="570" y="460" data-beat="2">35</text><text x="680" y="460" data-beat="3">40</text><text x="790" y="460" data-beat="4">45</text>
        </g>
        <text x="445" y="320" style="font-size:40px;fill:var(--paper);font-weight:700" data-beat="2+1">68 %</text>
      </svg>
      <div class="col grow">
        <div class="calc" data-beat="1">$\bar{x} = 30$ min, $s = 5$ min</div>
        <div class="calc" data-beat="2">$[\bar{x} - s\,;\,\bar{x} + s] = [25\,;\,35]$ → <b class="accent">68 %</b></div>
        <div class="calc" data-beat="3">$[\bar{x} - 2s\,;\,\bar{x} + 2s] = [20\,;\,40]$ → <b>95 %</b></div>
        <div class="calc" data-beat="4">$[\bar{x} - 3s\,;\,\bar{x} + 3s] = [15\,;\,45]$ → <b>99 %</b></div>
        <div class="card gold" data-beat="5"><div class="label">Approximation</div>symétrie, grand $n$</div>
      </div>

  # ================================================================ NOTION 7 : CHANGEMENT D'ORIGINE ET D'UNITÉ
  - id: s09_changement_def
    notion: 'Changement d''origine et d''unité'
    tag: 'Notion 7 / 11'
    title: 'Changement d''origine et d''unité'
    subtitle: 'Transformer toutes les données d''un coup'
    beats:
      - "Un changement d'origine ajoute la même quantité b à chaque observation. Par exemple, le patron augmente tous les salaires de 50 euros."
      - "Ou le prof retire 1 point sur chaque copie. Chaque x i devient x i plus b."
      - "Un changement d'unité multiplie chaque observation par un même nombre a, non nul. Par exemple, une augmentation de 5 pour cent : on multiplie par 1,05."
      - "Ou une interro sur 30 ramenée sur 20 : on multiplie par 2 tiers. Chaque x i devient a fois x i."
      - "Les deux ensemble, c'est une transformation linéaire : u i égale a fois x i, plus b. Question : faut-il tout recalculer ? Non !"
    html: |
      <div class="col w50">
        <div class="card main" data-beat="0"><div class="label">Changement d'origine</div>$x_i \to x_i + b$ <span class="muted">· +50 €, −1 point</span></div>
        <div class="card" data-beat="2"><div class="label">Changement d'unité</div>$x_i \to a\,x_i$ <span class="muted">· ×1,05, /30 → /20</span></div>
      </div>
      <div class="col w50">
        <div class="formula lg" data-beat="4">$$u_i = a\,x_i + b$$</div>
        <div class="calc" data-beat="4+3">tout recalculer ? <b class="accent">Non</b></div>
      </div>

  - id: s10_changement_proprietes
    notion: 'Changement d''origine et d''unité'
    tag: 'Notion 7 / 11'
    title: 'Ce que deviennent les paramètres'
    subtitle: 'Position : tout · Dispersion : seulement $a$'
    hold: 0.6
    beats:
      - "Intuition : déplace tout un nuage de points vers la droite. Son centre bouge, mais son étalement ne change pas. Par contre, si tu l'étires, l'étalement change."
      - "Les paramètres de position subissent tout, comme les observations. Le mode, la médiane et la moyenne deviennent a fois l'ancien paramètre, plus b."
      - "Les paramètres de dispersion subissent le changement d'unité, mais pas le changement d'origine. Le plus b disparaît."
      - "Attention, le cours écrit s u égale a fois s x. C'est une erreur : c'est vrai seulement si a est positif."
      - "Un écart-type est toujours positif. La formule exacte est donc : s u égale valeur absolue de a, fois s x. Pareil pour l'étendue et l'écart-moyen."
    html: |
      <div class="col w50">
        <div class="analogy" data-beat="0">
          <div class="icon">☁️</div>
          <div><b>Déplacer un nuage</b><br><span class="muted">le centre bouge, pas l'étalement</span></div>
        </div>
        <div class="card main" data-beat="1"><div class="label">Position : mode, médiane, moyenne</div>$\bar{u} = a\,\bar{x} + b$ <span class="muted">(idem $u_M$, $u_{1/2}$)</span></div>
      </div>
      <div class="col w50">
        <div class="card" data-beat="2"><div class="label">Dispersion</div>$E_t$, $E_m$, $s$ : le $+\,b$ disparaît</div>
        <div class="card accent" data-beat="3"><div class="label">⚠ Erreur du cours</div>$s_u = a\,s_x$ ✗ si $a &lt; 0$</div>
        <div class="formula" data-beat="4">$$s_u = |a|\,s_x$$</div>
      </div>

  - id: s11_changement_exemple
    notion: 'Changement d''origine et d''unité'
    tag: 'Notion 7 / 11'
    title: 'Exemple : une interro ramenée sur 20'
    subtitle: 'Sans recalculer une seule copie'
    beats:
      - "Une interro est notée sur 30. La moyenne vaut 18, l'écart-type 6."
      - "Le prof la ramène sur 20 : il multiplie chaque note par 2 tiers. La moyenne devient 2 tiers de 18, donc 12. L'écart-type, 2 tiers de 6, donc 4."
      - "Puis il ajoute 1 point de bonus à tout le monde. C'est un changement d'origine, avec b égale 1."
      - "La moyenne monte à 13. Mais l'écart-type reste 4 : les notes sont décalées, pas plus étalées."
    html: |
      <div class="col w40">
        <div class="card" data-beat="0"><div class="label">Sur 30</div>$\bar{x} = 18$ · $s_x = 6$</div>
        <div class="arrow-d" data-beat="1" data-anim="grow-x"></div>
        <div class="card main" data-beat="1"><div class="label">Sur 20 · $a = \frac{2}{3}$</div>$\bar{u} = 12$ · $s = 4$</div>
      </div>
      <div class="col grow">
        <div class="calc" data-beat="1">$\frac{2}{3} \times 18 = 12$ · $\frac{2}{3} \times 6 = 4$</div>
        <div class="calc" data-beat="2">+1 point bonus : $b = 1$</div>
        <div class="calc" data-beat="3">$\bar{u} = 13$ · $s_u = $ <span class="res">4</span> <span class="muted">(inchangé)</span></div>
        <div class="keep" data-beat="3+2">Décaler ne change pas l'étalement</div>
      </div>

  # ================================================================ NOTION 8 : MOYENNE PONDÉRÉE
  - id: s12_ponderee
    notion: 'Autres moyennes'
    tag: 'Notion 8 / 11'
    title: 'La moyenne pondérée'
    subtitle: 'Certaines valeurs pèsent plus'
    beats:
      - "Quand on parle de moyenne sans préciser, c'est la moyenne arithmétique. Mais il en existe d'autres. D'abord, la moyenne pondérée."
      - "Chaque observation x i reçoit un poids P i, qui indique son importance. Tu connais ça : ta note finale à l'ESI."
      - "Dans l'exemple du cours, les maths et la logique ont une pondération de 8, la statistique de 2. Les deux premiers cours pèsent 4 fois plus."
      - "On multiplie chaque valeur par son poids, et on divise par la somme des poids."
      - "Avec 12 en maths, 14 en logique et 17 en stat : 8 fois 12, plus 8 fois 14, plus 2 fois 17, ça fait 242. Divisé par 18 : environ 13,44."
      - "C'est la même formule que la moyenne avec les n i, ou que la réunion de groupes. En physique, elle donne le centre de gravité."
    html: |
      <div class="col w50">
        <div class="card main" data-beat="3"><div class="formula sm">$$\bar{x} = \frac{P_1 x_1 + P_2 x_2 + \dots + P_n x_n}{P_1 + P_2 + \dots + P_n}$$</div></div>
        <div class="card gold" data-beat="5"><div class="label">Même idée</div>$n_i$ · réunion · centre de gravité</div>
      </div>
      <div class="col w50">
        <table class="data" data-beat="2">
          <tr><th>Cours</th><th>$P_i$</th><th>Note</th></tr>
          <tr><td>Maths</td><td>8</td><td data-beat="4">12</td></tr>
          <tr><td>Logique</td><td>8</td><td data-beat="4">14</td></tr>
          <tr><td>Statistique</td><td>2</td><td data-beat="4">17</td></tr>
        </table>
        <div class="calc" data-beat="4+3">$\dfrac{242}{18} \approx$ <span class="res">13,44</span></div>
      </div>

  # ================================================================ NOTION 9 : GÉOMÉTRIQUE
  - id: s13_geometrique
    notion: 'Autres moyennes'
    tag: 'Notion 9 / 11'
    title: 'La moyenne géométrique $\bar{x}_G$'
    subtitle: 'Pour des taux qui se multiplient'
    beats:
      - "En finance, on utilise la moyenne géométrique pour trouver le taux moyen d'un placement."
      - "C'est la racine n-ième du produit des n valeurs. La somme est remplacée par un produit, et la division par n par une racine n-ième."
      - "Exemple : ton épargne gagne 10 pour cent la première année, puis 30 pour cent la deuxième. On multiplie donc par 1,10, puis par 1,30."
      - "Au total, le capital est multiplié par 1,43. La moyenne géométrique vaut racine de 1,43, environ 1,1958. Soit un taux moyen d'environ 19,58 pour cent."
      - "Piège : la moyenne arithmétique donnerait 20 pour cent. Mais 1,20 au carré, ça fait 1,44, pas 1,43."
      - "Enfin, le log de la moyenne géométrique, c'est la moyenne des log des valeurs."
    html: |
      <div class="col w50">
        <div class="card main" data-beat="1"><div class="formula sm">$$\bar{x}_G = \sqrt[n]{x_1\,x_2 \cdots x_n}$$</div></div>
        <div class="formula sm" data-beat="5">$$\log \bar{x}_G = \frac{1}{n}\sum_{i=1}^{n} \log x_i$$</div>
      </div>
      <div class="col w50">
        <div class="analogy" data-beat="2">
          <div class="icon">💶</div>
          <div><b>+10 % puis +30 %</b><br><span class="muted">× 1,10 puis × 1,30</span></div>
        </div>
        <div class="calc" data-beat="3">$\sqrt{1{,}10 \times 1{,}30} = \sqrt{1{,}43} \approx$ <span class="res">1,1958</span></div>
        <div class="card accent" data-beat="4"><div class="label">⚠ Pas 20 %</div>$1{,}20^2 = 1{,}44 \neq 1{,}43$</div>
      </div>

  # ================================================================ NOTION 10 : HARMONIQUE
  - id: s14_harmonique
    notion: 'Autres moyennes'
    tag: 'Notion 10 / 11'
    title: 'La moyenne harmonique $\bar{x}_H$'
    subtitle: 'Pour des vitesses sur une même distance'
    beats:
      - "La moyenne harmonique sert en physique. Par exemple, pour la vitesse moyenne sur plusieurs trajets de même distance."
      - "C'est l'inverse de la moyenne arithmétique des inverses. Un sur x barre H, égale un sur n, fois la somme des un sur x i."
      - "Exemple : tu fais 120 kilomètres à l'aller à 60 kilomètres par heure, et le retour à 40 kilomètres par heure."
      - "L'aller prend 2 heures, le retour 3 heures. Au total, 240 kilomètres en 5 heures : 48 kilomètres par heure."
      - "C'est exactement la moyenne harmonique de 60 et 40. Et pas 50, car tu passes plus de temps à rouler lentement."
    html: |
      <div class="col w50">
        <div class="card main" data-beat="1"><div class="formula sm">$$\frac{1}{\bar{x}_H} = \frac{1}{n}\left(\frac{1}{x_1} + \frac{1}{x_2} + \dots + \frac{1}{x_n}\right)$$</div></div>
        <div class="calc" data-beat="4">$\bar{x}_H = \dfrac{2}{\frac{1}{60} + \frac{1}{40}} = $ <span class="res">48</span></div>
      </div>
      <div class="col w50">
        <div class="row" data-beat="2"><span class="chip main">aller · 60 km/h</span><span class="chip">retour · 40 km/h</span></div>
        <div class="calc" data-beat="3">2 h + 3 h = 5 h pour 240 km</div>
        <div class="calc" data-beat="3+3">$\dfrac{240}{5} = 48$ km/h</div>
        <div class="card accent" data-beat="4+2"><div class="label">⚠ Pas 50</div>plus de temps à 40 km/h</div>
      </div>

  # ================================================================ NOTION 11 : COEFFICIENT DE VARIATION (annoté)
  - id: s15_cv
    notion: 'Coefficient de variation'
    tag: 'Notion 11 / 11'
    title: 'Le coefficient de variation $C_v$'
    subtitle: 'Point surligné : comparer des échelles différentes'
    hold: 0.5
    beats:
      - "Dernier paramètre, surligné dans ton cours : le coefficient de variation, C v."
      - "C'est un paramètre hybride : il combine un paramètre de position et un de dispersion. C v égale s divisé par x barre."
      - "Il mesure la dispersion par rapport à l'ordre de grandeur des valeurs. Il sert à comparer des groupes sur des échelles différentes."
      - "Exemple : l'action A vaut en moyenne 200 euros, avec un écart-type de 10. Son C v vaut 10 sur 200, donc 0,05."
      - "L'action B vaut 20 euros en moyenne, avec un écart-type de 4. Son C v vaut 4 sur 20, donc 0,20."
      - "B a le plus petit écart-type, mais elle est 4 fois plus volatile par rapport à son prix."
    html: |
      <div class="col w50">
        <div class="card main" data-beat="1"><div class="label">Position + dispersion</div><div class="formula">$$C_v = \frac{s}{\bar{x}}$$</div></div>
        <div class="calc" data-beat="2">dispersion <b>relative</b> à l'ordre de grandeur</div>
      </div>
      <div class="col w50">
        <table class="data" data-beat="3">
          <tr><th>Action</th><th>$\bar{x}$</th><th>$s$</th><th>$C_v$</th></tr>
          <tr><td>A</td><td>200 €</td><td>10 €</td><td data-beat="3+2">0,05</td></tr>
          <tr class="hl" data-hl="5"><td>B</td><td data-beat="4">20 €</td><td data-beat="4">4 €</td><td data-beat="4+2" class="ring" data-hl="5">0,20</td></tr>
        </table>
        <div class="keep" data-beat="5">B : 4 fois plus volatile</div>
      </div>

  # ================================================================ TABLEAU RÉCAPITULATIF
  - id: s16_tableau
    notion: 'Récapitulatif'
    title: 'Le tableau récapitulatif'
    subtitle: 'Une même formule, trois présentations'
    beats:
      - "Le cours termine par un grand tableau. Retiens la logique, pas chaque case."
      - "Données brutes : on divise la somme par n."
      - "Tableau recensé : on pondère chaque x i par sa fréquence f i."
      - "Données en classes : on garde les f i, et on remplace x i par le centre c i."
      - "C'est vrai pour la moyenne, l'écart-moyen et la variance. Et avec les n i, on remplace simplement f i par n i sur n."
    html: |
      <div class="col center">
      <table class="data" style="font-size:44px">
        <tr><th></th><th data-beat="1">Brutes</th><th data-beat="2">Recensées</th><th data-beat="3">Classes</th></tr>
        <tr><td>$\bar{x}$</td><td data-beat="1">$\frac{1}{n}\sum x_i$</td><td data-beat="2">$\sum f_i x_i$</td><td data-beat="3">$\sum f_i c_i$</td></tr>
        <tr><td>$E_m$</td><td data-beat="1">$\frac{1}{n}\sum |x_i - \bar{x}|$</td><td data-beat="2">$\sum f_i |x_i - \bar{x}|$</td><td data-beat="3">$\sum f_i |c_i - \bar{x}|$</td></tr>
        <tr class="hl" data-hl="4"><td>$s^2$</td><td data-beat="1">$\frac{1}{n}\sum x_i^2 - \bar{x}^2$</td><td data-beat="2">$\sum f_i x_i^2 - \bar{x}^2$</td><td data-beat="3">$\sum f_i c_i^2 - \bar{x}^2$</td></tr>
      </table>
      <div class="keep" data-beat="4" style="margin-top:40px">Avec les $n_i$ : remplacer $f_i$ par $\dfrac{n_i}{n}$</div>
      </div>

  # ================================================================ RÉCAP
  - id: s17_recap
    notion: 'Récapitulatif'
    title: 'Récap de la partie 2'
    beats:
      - "Récapitulons. L'étendue est simple, mais elle ne regarde que les extrêmes."
      - "L'écart-moyen est la moyenne des écarts en valeur absolue. La variance est la moyenne des écarts au carré, et l'écart-type sa racine."
      - "Pour calculer, on utilise la formule pratique : la moyenne des carrés, moins le carré de la moyenne."
      - "Environ 68, 95 et 99 pour cent des valeurs sont à 1, 2 ou 3 écarts-types de la moyenne."
      - "Si u i égale a x i plus b : la position subit tout, la dispersion seulement valeur absolue de a."
      - "Enfin : pondérée pour des importances, géométrique pour des taux, harmonique pour des vitesses, et C v pour comparer des échelles."
    html: |
      <div class="recap">
        <div class="item" data-beat="0"><b>Étendue</b> : $x_{\max} - x_{\min}$</div>
        <div class="item" data-beat="1"><span class="tex">$E_m = \frac{1}{n}\sum |x_i - \bar{x}|$</span> · <span class="tex">$s = \sqrt{s^2}$</span></div>
        <div class="item" data-beat="2"><span class="tex">$s^2 = \frac{1}{n}\sum x_i^2 - \bar{x}^2$</span></div>
        <div class="item" data-beat="3">$\bar{x} \pm s, 2s, 3s$ : 68 · 95 · 99 %</div>
        <div class="item" data-beat="4"><span class="tex">$\bar{u} = a\bar{x} + b$</span> · <span class="tex">$s_u = |a|\,s_x$</span></div>
        <div class="item" data-beat="5">Pondérée · géométrique · harmonique · <span class="tex">$C_v = \frac{s}{\bar{x}}$</span></div>
      </div>
