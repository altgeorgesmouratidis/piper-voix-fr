scenes:
  # ================================================================ TITRE
  - id: s00_titre
    layout: title
    notion: 'Introduction'
    beats:
      - "Analyse de données, chapitre 2, deuxième partie."
      - "On mesure maintenant l'étalement des données : étendue, écart-moyen, écart-type. Puis on voit les changements d'unité, et d'autres moyennes."
    html: |
      <svg viewBox="0 0 560 560" width="560" height="560">
        <circle cx="280" cy="280" r="250" fill="var(--paper)" stroke="var(--line)" stroke-width="3"/>
        <g data-beat="1" data-anim="draw" data-dur="1.4">
          <line class="stroke muted" x1="100" y1="380" x2="460" y2="380"/>
          <path class="stroke" d="M110,375 C200,370 220,170 280,170 C340,170 360,370 450,375" fill="none"/>
          <line class="stroke accent" x1="280" y1="170" x2="280" y2="380" style="stroke-dasharray:10 8"/>
        </g>
        <g data-beat="1+1.5" data-anim="grow-x">
          <line class="stroke gold" x1="215" y1="420" x2="345" y2="420" style="stroke-width:8"/>
        </g>
      </svg>

  # ================================================================ INTRO
  - id: s01_pourquoi
    notion: 'Introduction'
    title: 'La moyenne ne suffit pas'
    subtitle: 'Même centre, étalements différents'
    beats:
      - "Une interro donne une moyenne de 11 dans un groupe, et de 15 dans un autre. Le second groupe semble meilleur."
      - "Mais rien ne dit où est le meilleur étudiant. Il peut avoir 20 dans le premier groupe, alors que le second plafonne à 18."
      - "Encore plus frappant : deux séries peuvent avoir la même moyenne. Ici, 9, 10, 10 et 11 ont une moyenne de 10."
      - "Et 0, 5, 15 et 20 aussi ! Pourtant, la deuxième série est beaucoup plus étalée."
      - "Les paramètres de dispersion mesurent cet étalement autour de la moyenne. Ils n'ont de sens que pour des données quantitatives."
    html: |
      <div class="col w40">
        <div class="row" data-beat="0">
          <div class="person"><div class="face">1</div>moy. 11</div>
          <div class="person b"><div class="face">2</div>moy. 15</div>
        </div>
        <div class="calc" data-beat="1">meilleur : <b>20</b> dans le groupe 1 ?</div>
        <div class="keep" data-beat="4">Dispersion = étalement autour de $\bar{x}$</div>
      </div>
      <svg class="grow" viewBox="0 0 900 420" width="900" height="420">
        <line class="stroke muted" x1="60" y1="170" x2="860" y2="170" style="stroke-width:3"/>
        <line class="stroke muted" x1="60" y1="350" x2="860" y2="350" style="stroke-width:3"/>
        <g style="font-size:32px;fill:var(--muted)">
          <text x="50" y="215">0</text><text x="410" y="215">10</text><text x="830" y="215">20</text>
          <text x="50" y="395">0</text><text x="410" y="395">10</text><text x="830" y="395">20</text>
        </g>
        <line x1="460" y1="40" x2="460" y2="380" class="stroke accent" style="stroke-dasharray:10 8;stroke-width:3" data-beat="2" data-anim="draw"/>
        <g data-beat="2" data-anim="pop">
          <circle cx="420" cy="150" r="16" fill="var(--main)"/><circle cx="460" cy="150" r="16" fill="var(--main)"/>
          <circle cx="460" cy="112" r="16" fill="var(--main)"/><circle cx="500" cy="150" r="16" fill="var(--main)"/>
        </g>
        <text x="60" y="80" style="font-size:34px;fill:var(--main-ink);font-weight:700" data-beat="2">Série A</text>
        <g data-beat="3" data-anim="pop">
          <circle cx="60" cy="330" r="16" fill="var(--accent)"/><circle cx="260" cy="330" r="16" fill="var(--accent)"/>
          <circle cx="660" cy="330" r="16" fill="var(--accent)"/><circle cx="860" cy="330" r="16" fill="var(--accent)"/>
        </g>
        <text x="60" y="270" style="font-size:34px;fill:var(--accent);font-weight:700" data-beat="3">Série B</text>
      </svg>

  # ================================================================ NOTION 1 : ÉTENDUE
  - id: s02_etendue
    notion: 'Étendue'
    tag: 'Notion 1 / 11'
    title: 'L''étendue $E_t$'
    subtitle: 'Le plus grand moins le plus petit'
    beats:
      - "Le paramètre le plus naturel : l'étendue, notée E t. C'est la plus grande valeur moins la plus petite."
      - "Série A : 11 moins 9, égale 2. Série B : 20 moins 0, égale 20. On voit tout de suite que B est plus étalée."
      - "En continu, on prend la borne supérieure de la dernière classe, moins la borne inférieure de la première. Pour les poids : 100 moins 50, égale 50 kilos."
      - "Mais l'étendue est assez pauvre. Elle ne regarde que les deux valeurs extrêmes. Une seule valeur aberrante suffit à la gonfler."
      - "Les paramètres suivants, eux, utilisent toutes les observations."
    html: |
      <div class="col w50">
        <div class="formula" data-beat="0">$$E_t = x_{\max} - x_{\min}$$</div>
        <div class="calc" data-beat="1">A : $11 - 9 = 2$ · B : $20 - 0 = $ <span class="res">20</span></div>
        <div class="calc" data-beat="2">poids : $100 - 50 = 50$ kg</div>
      </div>
      <div class="col w50">
        <div class="card accent" data-beat="3"><div class="label">⚠ Limite</div>ne regarde que les <b>extrêmes</b></div>
        <div class="card main" data-beat="4"><div class="label">Ensuite</div>des paramètres qui utilisent <b>toutes</b> les valeurs</div>
      </div>

  # ================================================================ NOTION 2 : ÉCART-MOYEN
  - id: s03_ecart_moyen
    notion: 'Écart-moyen'
    tag: 'Notion 2 / 11'
    title: 'L''écart-moyen $E_m$'
    subtitle: 'La distance moyenne à la moyenne'
    beats:
      - "Intuition : des amis attendent le bus. En moyenne, à quelle distance de l'arrêt se trouvent-ils ? C'est l'idée de l'écart-moyen."
      - "L'écart-moyen, E m, c'est la moyenne des écarts entre chaque observation et la moyenne. Un sur n, fois la somme des valeurs absolues de x i moins x barre."
      - "La valeur absolue est indispensable : sans elle, les écarts positifs et négatifs s'annuleraient."
      - "Exemple : 4, 6, 8, 10, 12. La moyenne vaut 8. Les écarts, en valeur absolue : 4, 2, 0, 2 et 4."
      - "Leur somme vaut 12. On divise par 5 : l'écart-moyen vaut 2,4. En moyenne, une valeur est à 2,4 de la moyenne."
    html: |
      <div class="col w50">
        <div class="analogy" data-beat="0">
          <div class="icon">🚏</div>
          <div><b>Arrêt de bus</b><br><span class="muted">distance moyenne à l'arrêt</span></div>
        </div>
        <div class="card main" data-beat="1"><div class="formula sm">$$E_m = \frac{1}{n}\sum_{i=1}^{n} \htmlData{hl=2}{\left| x_i - \bar{x} \right|}$$</div></div>
      </div>
      <div class="col w50">
        <table class="data" data-beat="3">
          <tr><th>$x_i$</th><th>4</th><th>6</th><th>8</th><th>10</th><th>12</th></tr>
          <tr><td>$|x_i - 8|$</td><td>4</td><td>2</td><td>0</td><td>2</td><td>4</td></tr>
        </table>
        <div class="calc" data-beat="4">$E_m = \dfrac{12}{5} = $ <span class="res">2,4</span></div>
      </div>

  # ================================================================ NOTION 3 : VARIANCE / ÉCART-TYPE (annoté)
  - id: s04_variance
    notion: 'Écart-type'
    tag: 'Notion 3 / 11'
    title: 'Variance $s^2$ et écart-type $s$'
    subtitle: 'Point surligné : la formule de base'
    hold: 0.5
    beats:
      - "Les statisticiens préfèrent l'écart-type, noté s. On définit d'abord son carré, la variance, s carré."
      - "s carré, c'est un sur n, fois la somme des x i moins x barre, au carré. Au lieu de la valeur absolue, on élève les écarts au carré."
      - "C'est la moyenne des écarts quadratiques. Et l'écart-type, c'est la racine carrée de la variance."
      - "Même série : les écarts sont moins 4, moins 2, 0, 2 et 4. Au carré : 16, 4, 0, 4 et 16. Total : 40."
      - "La variance vaut 40 sur 5, donc 8. L'écart-type vaut racine de 8, environ 2,83."
      - "Compare avec l'écart-moyen, 2,4 : même ordre de grandeur, et s est un peu plus grand. C'est toujours le cas."
    html: |
      <div class="col w50">
        <div class="card main" data-beat="1"><div class="formula sm">$$s^2 = \frac{1}{n}\sum_{i=1}^{n} \htmlData{hl=1+3}{(x_i - \bar{x})^2}$$</div></div>
        <div class="formula sm" data-beat="2">$$s = \sqrt{s^2}$$</div>
      </div>
      <div class="col w50">
        <table class="data" data-beat="3">
          <tr><th>$x_i - 8$</th><th>−4</th><th>−2</th><th>0</th><th>2</th><th>4</th></tr>
          <tr><td>au carré</td><td>16</td><td>4</td><td>0</td><td>4</td><td>16</td></tr>
        </table>
        <div class="calc" data-beat="4">$s^2 = \dfrac{40}{5} = 8$ · $s = \sqrt{8} \approx$ <span class="res">2,83</span></div>
        <div class="calc" data-beat="5">$E_m = 2{,}4 &lt; s = 2{,}83$</div>
      </div>

  - id: s05_pourquoi_s
    notion: 'Écart-type'
    tag: 'Notion 3 / 11'
    title: 'Pourquoi préférer l''écart-type ?'
    subtitle: 'Plus maniable, et central en probabilité'
    beats:
      - "Pourquoi cette préférence ? D'abord, la formule est plus maniable. Les valeurs absolues de l'écart-moyen sont peu pratiques en calcul."
      - "Ensuite, l'écart-type joue un rôle central dans la suite du cours : les probabilités et les distributions."
      - "Attention aux unités. La variance est en unités au carré : des kilos carrés, par exemple."
      - "L'écart-type, grâce à la racine, revient dans l'unité des données. C'est lui qu'on interprète."
    html: |
      <div class="col w50">
        <div class="card" data-beat="0"><div class="label">1 · Maniable</div>un carré au lieu de $|\ldots|$</div>
        <div class="card" data-beat="1"><div class="label">2 · Théorie</div>clé des probabilités</div>
      </div>
      <div class="col w50">
        <div class="calc" data-beat="2">$s^2$ en kg²</div>
        <div class="calc" data-beat="3">$s$ en <b>kg</b>, comme les données</div>
        <div class="keep" data-beat="3+2">On interprète $s$, pas $s^2$</div>
      </div>

  # ================================================================ NOTION 4 : FORMULE PRATIQUE (annoté)
  - id: s06_formule_pratique
    notion: 'Écart-type'
    tag: 'Notion 4 / 11'
    title: 'La formule de calcul pratique'
    subtitle: 'Point surligné : moyenne des carrés moins carré de la moyenne'
    hold: 0.5
    beats:
      - "Pour calculer s carré, on retiendra une deuxième formule, équivalente mais plus rapide."
      - "s carré égale un sur n, fois la somme des x i au carré, moins x barre au carré. La moyenne des carrés, moins le carré de la moyenne."
      - "Plus besoin de calculer chaque écart. On élève directement les valeurs au carré."
      - "Même série : 16, 36, 64, 100 et 144. La somme vaut 360. Divisée par 5 : 72."
      - "On retire x barre au carré : 8 au carré, 64. 72 moins 64, égale 8. On retrouve bien la même variance."
      - "Le cours démontre l'égalité en développant le carré. Ici, on l'a vérifiée sur un exemple."
    html: |
      <div class="col w50">
        <div class="card main" data-beat="1"><div class="formula sm">$$s^2 = \htmlData{hl=1+2}{\frac{1}{n}\sum_{i=1}^{n} x_i^2} - \htmlData{hl=1+4}{\bar{x}^2}$$</div></div>
        <div class="card gold" data-beat="2"><div class="label">Avantage</div>pas besoin des écarts $x_i - \bar{x}$</div>
      </div>
      <div class="col w50">
        <table class="data" data-beat="3">
          <tr><th>$x_i$</th><th>4</th><th>6</th><th>8</th><th>10</th><th>12</th></tr>
          <tr><td>$x_i^2$</td><td>16</td><td>36</td><td>64</td><td>100</td><td>144</td></tr>
        </table>
        <div class="calc" data-beat="3+3">$\dfrac{360}{5} = 72$</div>
        <div class="calc" data-beat="4">$s^2 = 72 - 8^2 = $ <span class="res">8</span> ✓</div>
      </div>

  # ================================================================ NOTION 5 : ADAPTER AUX CLASSES
  - id: s07_classes
    notion: 'Écart-type'
    tag: 'Notion 5 / 11'
    title: 'Écart-type de données en classes'
    subtitle: 'Fréquences et centres de classe'
    beats:
      - "Comme pour la moyenne, la formule s'adapte. Avec un tableau, on pondère par f i. En continu, on remplace x i par le centre de classe c i."
      - "Formule pratique en continu : s carré égale la somme des f i fois c i au carré, moins x barre au carré."
      - "Reprenons les poids. Pour la deuxième classe : 0,35 fois 70 au carré, ça donne 1715. Sur les quatre classes, le total vaut 5425."
      - "La moyenne vaut 72,75. Au carré, environ 5292,56."
      - "s carré égale 5425 moins 5292,56, environ 132,44. L'écart-type vaut environ 11,51 kilos."
    html: |
      <table class="data">
        <tr><th>$f_i$</th><th>$c_i$</th><th class="hl" data-hl="2">$f_i\,c_i^2$</th></tr>
        <tr><td>0,25</td><td>57,5</td><td data-beat="2+3">826,56</td></tr>
        <tr class="hl" data-hl="2"><td>0,35</td><td>70</td><td data-beat="2">1715</td></tr>
        <tr><td>0,25</td><td>80</td><td data-beat="2+3.3">1600</td></tr>
        <tr><td>0,15</td><td>92,5</td><td data-beat="2+3.6">1283,44</td></tr>
        <tr class="tot"><td colspan="2">Total</td><td data-beat="2+4.5">5425</td></tr>
      </table>
      <div class="col grow">
        <div class="card main" data-beat="1"><div class="formula sm">$$s^2 = \sum_{i=1}^{k} f_i\,c_i^2 - \bar{x}^2$$</div></div>
        <div class="calc" data-beat="3">$\bar{x}^2 = 72{,}75^2 \approx 5292{,}56$</div>
        <div class="calc" data-beat="4">$s^2 \approx 132{,}44$ · $s \approx$ <span class="res">11,51 kg</span></div>
      </div>

  # ================================================================ NOTION 6 : 68-95-99
  - id: s08_intervalles
    notion: 'Intérêt de l''écart-type'
    tag: 'Notion 6 / 11'
    title: 'La règle 68 – 95 – 99'
    subtitle: 'Ce que dit l''écart-type'
    hold: 0.5
    beats:
      - "Avec la moyenne et l'écart-type, on peut estimer où se trouvent les observations."
      - "Exemple : ton trajet dure en moyenne 30 minutes, avec un écart-type de 5 minutes."
      - "Entre x barre moins s et x barre plus s, donc entre 25 et 35 minutes : environ 68 pour cent des trajets."
      - "Entre x barre moins 2 s et x barre plus 2 s, donc entre 20 et 40 minutes : environ 95 pour cent."
      - "Et à 3 écarts-types, entre 15 et 45 minutes : environ 99 pour cent."
      - "Attention : ce sont des approximations. Elles supposent une distribution à peu près symétrique, et beaucoup d'observations. On y reviendra avec la loi normale."
