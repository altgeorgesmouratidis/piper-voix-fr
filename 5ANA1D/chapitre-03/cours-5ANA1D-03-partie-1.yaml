        <div class="card accent" data-beat="0"><div class="label">Défaut</div>$s_{xy}$ dépend des <b>unités</b> (cm, m…)</div>
        <div class="card main" data-beat="1"><div class="formula">$$r = \frac{s_{xy}}{s_x\, s_y}$$</div></div>
        <div class="calc" data-beat="4">$r = \dfrac{3{,}02}{2{,}75 \times 1{,}97} = $ <span class="res">0,557</span></div>
      </div>
      <div class="col w50">
