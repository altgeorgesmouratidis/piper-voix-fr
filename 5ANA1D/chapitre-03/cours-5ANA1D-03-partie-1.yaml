  # ================================================================ INTRO
  - id: s01_intro
    notion: 'Introduction'
    title: 'Deux mesures à la fois'
    subtitle: 'Y a-t-il un lien entre X et Y ?'
    beats:
      - "Jusqu'ici, on étudiait une seule caractéristique à la fois : le poids, ou la taille."
      - "Dans ce chapitre, on mesure deux choses sur chaque individu. Par exemple, sa taille X et son poids Y."
      - "La grande question : y a-t-il un lien entre les deux ? Si je connais la taille, puis-je estimer le poids ?"
      - "Pour mesurer ce lien, on va construire un nombre : le coefficient de corrélation."
      - "Ensuite, on tracera la droite qui résume le mieux ce lien : la droite de régression."
    html: |
      <div class="col w50">
        <div class="card" data-beat="0"><div class="label">Avant</div>une seule variable : <b>le poids</b></div>
        <div class="row" data-beat="1">
          <div class="node">Taille $X$</div>
          <div class="arrow-r" data-beat="2" data-anim="grow-x"></div>
          <div class="node alt">Poids $Y$</div>
        </div>
        <div class="calc" data-beat="2">je connais $X$ : puis-je <b>estimer</b> $Y$ ?</div>
      </div>
      <div class="col w50">
        <div class="def" data-beat="3"><div class="term">Coefficient de corrélation</div>mesure la force du lien</div>
        <div class="def" data-beat="4" style="border-top-color:var(--gold)"><div class="term">Droite de régression</div>résume ce lien par une droite</div>
      </div>

