        <div class="keep" data-beat="4">$r$ mesure l'<b>alignement</b>, pas la pente</div>
      </div>

  # ================================================================ NOTION 6 : DROITE DE RÉGRESSION
  - id: s09_regression
    notion: 'Droite de régression'
    tag: 'Notion 6 / 9'
    title: 'La droite de régression'
    subtitle: 'La droite des moindres carrés'
    hold: 0.5
    beats:
      - "Quand la corrélation est forte, le nuage ressemble à une droite. L'idée : trouver la droite qui passe au plus près de tous les points."
      - "Imagine que tu poses une règle sur le nuage. Tu la fais glisser et tourner jusqu'à ce qu'elle colle au mieux aux points."
      - "Pour chaque point, on mesure l'écart vertical entre le point et la droite. Ce sont les traits jaunes."
      - "La droite de régression est celle qui rend la somme des carrés de ces écarts la plus petite possible."
      - "C'est pour ça qu'on l'appelle aussi la droite des moindres carrés."
      - "Pourquoi des carrés ? Sans eux, les écarts au-dessus et en dessous de la droite s'annuleraient."
    html: |
      <div class="col" style="width:600px">
        <div class="analogy" data-beat="1">
          <div class="icon">📏</div>
          <div><b>La règle</b><br><span class="muted">au plus près des points</span></div>
        </div>
        <div class="card main" data-beat="3">
          <div class="formula sm">$$\min_{a,\,b}\ \sum_{i=1}^{n} \htmlData{hl=5}{(a x_i + b - y_i)^2}$$</div>
          <div class="legend" data-beat="3+2">
            <span class="sym">$a x_i + b - y_i$</span><span>écart vertical</span>
          </div>
        </div>
        <div class="calc" data-beat="4">droite des <b>moindres carrés</b></div>
      </div>
