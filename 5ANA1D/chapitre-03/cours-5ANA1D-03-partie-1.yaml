  # ================================================================ NOTION 7 : a ET b
  - id: s10_coefs
    notion: 'Coefficients a et b'
    tag: 'Notion 7 / 9'
    title: 'Calculer $a$ et $b$'
    subtitle: 'Équation de la droite $y = ax + b$'
    hold: 0.5
    beats:
      - "La droite a pour équation y égale a x plus b. Le cours donne directement les deux coefficients."
      - "La pente a vaut la covariance, divisée par la variance de X : s x y sur s x au carré."
      - "L'ordonnée à l'origine b vaut y barre, moins a fois x barre."
      - "Dans notre exemple : a égale 3,02, divisé par 2,75 au carré. On obtient environ 0,399, donc à peu près 0,4."
      - "Et b égale 11,1, moins 0,399 fois 11,8. On obtient environ 6,39."
      - "La droite de régression est donc : y égale 0,4 x, plus 6,4."
    html: |
      <div class="col w50">
        <div class="formula lg" data-beat="0">$$y = a\,x + b$$</div>
        <div class="card main" data-beat="1">
          <div class="formula sm">$$a = \frac{s_{xy}}{s_x^2}$$</div>
          <div class="formula sm" data-beat="2">$$b = \bar{y} - a\,\bar{x}$$</div>
        </div>
      </div>
      <div class="col w50">
        <div class="calc" data-beat="3">$a = \dfrac{3{,}02}{2{,}75^2} \approx 0{,}399$</div>
        <div class="calc" data-beat="4">$b = 11{,}1 - 0{,}399 \times 11{,}8 \approx 6{,}39$</div>
        <div class="keep" data-beat="5"><span class="big">$y \approx 0{,}4\,x + 6{,}4$</span></div>
      </div>

  - id: s11_prediction
    notion: 'Coefficients a et b'
    tag: 'Notion 7 / 9'
    title: 'Lire et utiliser la droite'
    subtitle: 'Prédire une cote de stat'
    hold: 0.5
    beats:
      - "Comment lire cette droite ?"
      - "La pente a, c'est delta y sur delta x. Ici, 0,4 : un point de plus en maths donne, en moyenne, 0,4 point de plus en stat."
      - "Le nombre 6,4, c'est la valeur de y quand x vaut 0. C'est là que la droite coupe l'axe vertical."
      - "Surtout, la droite sert à prédire. Un étudiant a 14 en maths : 0,4 fois 14, plus 6,4, ça donne 12."
      - "On estime donc sa cote de stat à environ 12. C'est une estimation, pas une certitude."
    html: |
      <div class="col" style="width:640px">
        <div class="card main" data-beat="1">pente $a = \Delta y / \Delta x \approx 0{,}4$<br><span class="muted">+1 en maths : +0,4 en stat</span></div>
        <div class="card gold" data-beat="2">$b \approx 6{,}4$ : $y$ quand $x = 0$</div>
        <div class="calc" data-beat="3">$0{,}4 \times 14 + 6{,}4 = $ <span class="res">12</span></div>
        <div class="keep" data-beat="4">une <b>estimation</b>, pas une certitude</div>
      </div>
